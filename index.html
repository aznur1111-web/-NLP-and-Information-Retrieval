 for(let t=1;t<obs.length;t++){
  V.push({});
  const newPath={};
  for(const s of states){
   let best=-Infinity,bestS=0;
   for(const s2 of states){
    const p=V[t-1][s2]+log2(trans[s2*2+s])+log2(emit[s*2+obs[t]]);
    if(p>best){best=p;bestS=s2}
   }
   V[t][s]=best;
   newPath[s]=path[bestS].concat(s);
  }
  path=newPath;
 }
 let last=0,bestP=-Infinity;
 for(const s of states){
  if(V[obs.length-1][s]>bestP){bestP=V[obs.length-1][s];last=s}
 }
 const seq=path[last];
 return {
  encoded:`Observations: [${obs.join(', ')}]\n\nViterbi path: [${seq.join(', ')}]\nLog-probability: ${fmtNum(bestP,4)}\n\nDecoded:\n${seq.map((s,i)=>`  t=${i+1}: state ${s}, obs ${obs[i]}`).join('\n')}`,
  decoded:`Viterbi fills a DP table of best scores and back-pointers, then backtracks to find the most likely state sequence. Complexity is O(T K^2).`
 };
}

/* 5 TF-IDF */
function demoTfidf(text){
 const docs=text.trim().split(/\n/).filter(Boolean);
 if(!docs.length)throw Error('Enter one document per line.');
 const N=docs.length;
 const tokenized=docs.map(d=>tokenize(d,true,true));
 const df={};
 for(const toks of tokenized){
  const seen=new Set(toks);
  for(const w of seen)df[w]=(df[w]||0)+1;
 }
 const vectors=tokenized.map(toks=>{
  const tf={};
  for(const w of toks)tf[w]=(tf[w]||0)+1;
  const vec={};
  for(const w in tf){
   vec[w]=(1+Math.log(tf[w]))*Math.log((N+1)/(df[w]+1))+1;
  }
  const n=Math.sqrt(Object.values(vec).reduce((a,b)=>a+b*b,0))||1;
  for(const w in vec)vec[w]/=n;
  return vec;
 });
 const lines=docs.map((d,i)=>{
  const top=Object.entries(vectors[i]).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `  Doc ${i+1}: ${top.map(([w,s])=>`${w}(${fmtNum(s,2)})`).join(', ')}`;
 });
 return {
  encoded:`Documents: ${N}\nVocabulary: ${Object.keys(df).length}\n\nTop TF-IDF terms per document:\n${lines.join('\n')}\n\nDocument frequencies:\n${Object.entries(df).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([w,n])=>`  ${w}: ${n}`).join('\n')}`,
  decoded:`TF-IDF weights a term by its frequency in the document and its rarity across the corpus. Rare terms get high weight.`
 };
}

/* 5 TextRank */
function demoTextrank(text){
 const tokens=tokenize(text,true,true);
 if(tokens.length<10)throw Error('Enter at least 10 tokens.');
 const window=2,d=0.85;
 const graph={};
 for(const w of tokens)graph[w]=new Set();
 for(let i=0;i<tokens.length;i++){
  for(let j=Math.max(0,i-window);j<Math.min(tokens.length,i+window+1);j++){
   if(i!==j){
    graph[tokens[i]].add(tokens[j]);
    graph[tokens[j]].add(tokens[i]);
   }
  }
 }
 const nodes=Object.keys(graph);
 const scores={};
 for(const n of nodes)scores[n]=1/nodes.length;
 for(let it=0;it<30;it++){
  const newS={};
  for(const n of nodes){
   let s=1-d;
   for(const m of graph[n])s+=d*scores[m]/graph[m].size;
   newS[n]=s;
  }
  Object.assign(scores,newS);
 }
 const ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
 return {
  encoded:`Tokens: ${tokens.length}\nUnique: ${nodes.length}\nWindow: ${window}\nDamping: ${d}\n\nTop-ranked terms:\n${ranked.slice(0,12).map(([w,s],i)=>`  ${i+1}. ${w} (${fmtNum(s,4)})`).join('\n')}`,
  decoded:`TextRank builds a co-occurrence graph and runs PageRank. High-ranked words are the key terms. Filter stopwords for better results.`
 };
}

/* 5 LDA */
function demoLda(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter: K iterations on the first line, then one document per line.');
 const params=lines[0].split(/[\s,]+/).filter(Boolean).map(Number);
 const K=Math.max(2,Math.min(params[0]||2,6));
 const iters=Math.max(10,Math.min(params[1]||30,200));
 const docs=lines.slice(1);
 const tokenized=docs.map(d=>tokenize(d,true,true));
 const vocab=[...new Set(tokenized.flat())].sort();
 const w2i={};
 vocab.forEach((w,i)=>w2i[w]=i);
 const V=vocab.length;
 const alpha=0.1,beta=0.01;
 const rand=rngFactory(42);
 // Initialize topics randomly
 const z=tokenized.map(d=>d.map(()=>Math.floor(rand()*K)));
 const ndk=tokenized.map(d=>new Array(K).fill(0));
 const nkw=Array.from({length:K},()=>new Array(V).fill(0));
 const nk=new Array(K).fill(0);
 for(let d=0;d<tokenized.length;d++){
  for(let w=0;w<tokenized[d].length;w++){
   const k=z[d][w];
   const wi=w2i[tokenized[d][w]];
   ndk[d][k]++;nkw[k][wi]++;nk[k]++;
  }
 }
 for(let it=0;it<iters;it++){
  for(let d=0;d<tokenized.length;d++){
   for(let w=0;w<tokenized[d].length;w++){
    const wi=w2i[tokenized[d][w]];
    const old=z[d][w];
    ndk[d][old]--;nkw[old][wi]--;nk[old]--;
    const probs=[];
    for(let k=0;k<K;k++){
     probs.push((ndk[d][k]+alpha)*(nkw[k][wi]+beta)/(nk[k]+beta*V));
    }
    const total=probs.reduce((a,b)=>a+b,0);
    let r=rand()*total,cum=0,newK=K-1;
    for(let k=0;k<K;k++){cum+=probs[k];if(r<cum){newK=k;break}}
    z[d][w]=newK;
    ndk[d][newK]++;nkw[newK][wi]++;nk[newK]++;
   }
  }
 }
 const topics=[];
 for(let k=0;k<K;k++){
  const top=[];
  const idx=[...Array(V).keys()].sort((a,b)=>nkw[k][b]-nkw[k][a]).slice(0,10);
  for(const i of idx)top.push(vocab[i]);
  topics.push(top);
 }
 const docTopics=ndk.map(row=>{
  const tot=row.reduce((a,b)=>a+b,0);
  return row.map(v=>v/tot);
 });
 return {
  encoded:`Documents: ${docs.length}\nVocabulary: ${V}\nTopics K=${K}\nIterations: ${iters}\n\nTopics (top words):\n${topics.map((t,i)=>`  Topic ${i+1}: ${t.join(', ')}`).join('\n')}\n\nDocument-topic mixtures:\n${docTopics.map((d,i)=>`  Doc ${i+1}: ${d.map((p,k)=>`T${k+1}=${fmtNum(p,2)}`).join(', ')}`).join('\n')}`,
  decoded:`LDA assigns each word to a topic and learns topic distributions per document and word distributions per topic. Collapsed Gibbs sampling iteratively resamples topic assignments.`
 };
}

/* 6 CYK */
function demoCyk(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter grammar rules (A -> B C or A -> word), then the sentence on the last line.');
 const grammar={};
 let sentence='';
 for(let i=0;i<lines.length;i++){
  const line=lines[i];
  if(line.includes('->')){
   const [lhs,rhs]=line.split('->').map(s=>s.trim());
   if(!grammar[lhs])grammar[lhs]=[];
   const parts=rhs.split(/\s+/);
   grammar[lhs].push(parts);
  } else {
   sentence=line;
  }
 }
 if(!sentence)throw Error('No sentence found.');
 const words=sentence.split(/\s+/);
 const n=words.length;
 const table=Array.from({length:n},()=>Array.from({length:n},()=>new Set()));
 // Lexical rules
 for(let i=0;i<n;i++){
  for(const A in grammar){
   for(const p of grammar[A]){
    if(p.length===1&&p[0]===words[i])table[i][i].add(A);
   }
  }
 }
 // Binary rules
 const back=Array.from({length:n},()=>Array.from({length:n},()=>new Map()));
 for(let len=2;len<=n;len++){
  for(let i=0;i<=n-len;i++){
   const j=i+len-1;
   for(let k=i;k<j;k++){
    for(const A in grammar){
     for(const p of grammar[A]){
      if(p.length===2&&table[i][k].has(p[0])&&table[k+1][j].has(p[1])){
       table[i][j].add(A);
       back[i][j].set(A,[p[0],p[1],k]);
      }
     }
    }
   }
  }
 }
 const accepted=table[0][n-1].has('S');
 // Build the tree
 function build(i,j,A){
  if(i===j){
   for(const p of grammar[A]||[]){
    if(p.length===1&&p[0]===words[i])return `${A}(${words[i]})`;
   }
   return A;
  }
  const b=back[i][j].get(A);
  if(!b)return A;
  const [B,C,k]=b;
  return `${A}(${build(i,k,B)} ${build(k+1,j,C)})`;
 }
 const tree=accepted?build(0,n-1,'S'):'(no parse)';
 return {
  encoded:`Sentence: ${sentence}\nTokens: ${n}\nGrammar rules: ${Object.values(grammar).reduce((a,b)=>a+b.length,0)}\n\nAccepted: ${accepted}\n\nParse tree:\n  ${tree}`,
  decoded:`CYK fills a table of nonterminals per span, combining spans via binary rules. The grammar must be in Chomsky Normal Form (A -> B C or A -> w).`
 };
}

/* 7 inverted index */
function demoInvertedIndex(text){
 const docs=text.trim().split(/\n/).filter(Boolean);
 if(!docs.length)throw Error('Enter one document per line.');
 const index={};
 for(let i=0;i<docs.length;i++){
  const toks=new Set(tokenize(docs[i],true,true));
  for(const t of toks){
   if(!index[t])index[t]=[];
   index[t].push(i);
  }
 }
 const terms=Object.keys(index).sort();
 return {
  encoded:`Documents: ${docs.length}\nVocabulary: ${terms.length}\n\nInverted index:\n${terms.map(t=>`  ${t}: [${index[t].join(', ')}]`).join('\n')}\n\nQuery examples:\n  AND "cat sat": ${(()=>{
   const a=index['cat']||[],b=index['sat']||[];
   return a.filter(x=>b.includes(x)).join(', ')||'(none)';
  })()}\n  OR "cat dog": ${[...new Set([...(index['cat']||[]),...(index['dog']||[])])].sort((a,b)=>a-b).join(', ')||'(none)'}`,
  decoded:`An inverted index maps each term to the sorted list of documents containing it. AND intersects postings, OR unions them.`
 };
}

/* 7 BM25 */
function demoBm25(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter the query on the first line, then one document per line.');
 const query=lines[0];
 const docs=lines.slice(1);
 const k1=1.2,b=0.75;
 const tokenized=docs.map(d=>tokenize(d,true,true));
 const N=docs.length;
 const avgdl=tokenized.reduce((s,d)=>s+d.length,0)/N;
 const df={};
 for(const toks of tokenized){
  const seen=new Set(toks);
  for(const w of seen)df[w]=(df[w]||0)+1;
 }
 const scores=[];
 for(let i=0;i<tokenized.length;i++){
  const tf={};
  for(const w of tokenized[i])tf[w]=(tf[w]||0)+1;
  const dl=tokenized[i].length;
  let s=0;
  for(const term of tokenize(query,true,true)){
   if(!tf[term])continue;
   const idf=Math.log((N-df[term]+0.5)/(df[term]+0.5)+1);
   const num=tf[term]*(k1+1);
   const den=tf[term]+k1*(1-b+b*dl/avgdl);
   s+=idf*num/den;
  }
  scores.push([i,s]);
 }
 scores.sort((a,b)=>b[1]-a[1]);
 return {
  encoded:`Query: ${query}\nk1=${k1}, b=${b}\nDocuments: ${N}\nAverage length: ${fmtNum(avgdl,2)}\n\nRanked documents:\n${scores.map(([i,s],r)=>`  ${r+1}. Doc ${i+1}: score ${fmtNum(s,4)}`).join('\n')}\n\nDocument text:\n${docs.map((d,i)=>`  Doc ${i+1}: ${d}`).join('\n')}`,
  decoded:`BM25 weights terms by IDF, saturates term frequency with k1, and normalizes document length with b. Higher score means more relevant.`
 };
}

/* 8 Dense embeddings */
function demoDenseEmbeddings(text){
 const docs=text.trim().split(/\n/).filter(Boolean);
 if(docs.length<2)throw Error('Enter at least 2 documents.');
 const dim=32;
 function embed(text){
  const rand=rngFactory(0);
  const vec=new Array(dim).fill(0);
  for(const w of tokenize(text,true,true)){
   const r2=rngFactory(hashStr(w));
   for(let i=0;i<dim;i++)vec[i]+=r2()*2-1;
  }
  return normalizeDense(vec);
 }
 const embs=docs.map(embed);
 const sims=[];
 for(let i=0;i<docs.length;i++)for(let j=i+1;j<docs.length;j++){
  sims.push([i,j,cosineDense(embs[i],embs[j])]);
 }
 sims.sort((a,b)=>b[2]-a[2]);
 const query="cat";
 const qEmb=embed(query);
 const qScores=docs.map((d,i)=>[i,cosineDense(qEmb,embs[i])]).sort((a,b)=>b[1]-a[1]);
 return {
  encoded:`Documents: ${docs.length}\nEmbedding dim: ${dim}\n\nTop document-document similarities:\n${sims.slice(0,5).map(([i,j,s])=>`  Doc ${i+1} ~ Doc ${j+1}: ${fmtNum(s,3)}`).join('\n')}\n\nQuery: "${query}"\nRanked documents:\n${qScores.map(([i,s],r)=>`  ${r+1}. Doc ${i+1}: ${fmtNum(s,3)}`).join('\n')}`,
  decoded:`Dense embeddings map text to fixed-size vectors. Cosine similarity ranks documents. In production, use a trained encoder (sentence-transformers, DPR, E5) instead of random projection.`
 };
}
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

/* 9 Cross-encoder */
function demoCrossEncoder(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter the query on the first line, then candidate passages.');
 const query=lines[0];
 const candidates=lines.slice(1);
 function score(query,passage){
  const q=new Set(tokenize(query,true,true));
  const p=new Set(tokenize(passage,true,true));
  if(!q.size)return 0;
  let overlap=0;
  for(const t of q)if(p.has(t))overlap++;
  const coverage=overlap/q.size;
  const lenPen=1/(1+Math.log(1+p.size));
  return coverage*(1+lenPen);
 }
 const scored=candidates.map((c,i)=>[i,score(query,c)]).sort((a,b)=>b[1]-a[1]);
 return {
  encoded:`Query: ${query}\nCandidates: ${candidates.length}\n\nReranked passages:\n${scored.map(([i,s],r)=>`  ${r+1}. (score ${fmtNum(s,3)}) ${candidates[i]}`).join('\n')}`,
  decoded:`A cross-encoder jointly scores query and passage. This simple surrogate uses query term coverage and a length penalty. In production, use a fine-tuned transformer cross-encoder.`
 };
}

/* 9 Extractive QA */
function demoExtractiveQa(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter the question on the first line, then passages.');
 const question=lines[0];
 const passages=lines.slice(1);
 function bestSpan(q,passage){
  const qt=new Set(tokenize(q,true,true));
  const toks=tokenize(passage,true,false);
  let best={score:-1,text:''};
  for(let i=0;i<toks.length;i++){
   for(let j=i+1;j<=Math.min(i+15,toks.length);j++){
    const span=toks.slice(i,j);
    const st=new Set(span.map(t=>t.toLowerCase()));
    let overlap=0;
    for(const t of qt)if(st.has(t))overlap++;
    const coverage=overlap/qt.size;
    const lenPen=1/(1+Math.log(1+span.length));
    const s=coverage*(1+lenPen);
    if(s>best.score)best={score:s,text:span.join(' ')};
   }
  }
  return best;
 }
 const scored=passages.map((p,i)=>{
  const b=bestSpan(question,p);
  return {i,score:b.score,span:b.text,passage:p};
 }).sort((a,b)=>b.score-a.score);
 const top=scored[0];
 return {
  encoded:`Question: ${question}\n\nRanked passages:\n${scored.map((s,r)=>`  ${r+1}. score ${fmtNum(s.score,3)} — passage ${s.i+1}: ${s.passage}`).join('\n')}\n\nBest answer span: "${top.span}"\nFrom passage ${top.i+1}`,
  decoded:`Extractive QA scores every span in a passage against the question. The best span is the answer. In production, a fine-tuned transformer predicts start and end positions.`
 };
}

/* 10 Chunking */
function demoChunking(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(!lines.length)throw Error('Enter: size overlap on the first line, then the text.');
 const params=lines[0].split(/[\s,]+/).filter(Boolean).map(Number);
 const size=Math.max(20,params[0]||80);
 const overlap=Math.max(0,Math.min(params[1]||20,size-1));
 const body=lines.slice(1).join('\n');
 if(!body)throw Error('Enter the text on the second line.');
 const chunks=[];
 let i=0;
 while(i<body.length){
  chunks.push(body.slice(i,i+size));
  if(i+size>=body.length)break;
  i+=size-overlap;
 }
 // Recursive splitter (paragraph -> sentence -> char)
 function recursive(t){
  if(t.length<=size)return [t];
  for(const sep of ['\n\n','\n','. ',' ']){
   if(t.includes(sep)){
    const parts=t.split(sep);
    const out=[];
    let cur='';
    for(const p of parts){
     if((cur+sep+p).length>size&&cur){out.push(cur);cur=p}
     else{cur=cur?cur+sep+p:p}
    }
    if(cur)out.push(cur);
    return out.flatMap(x=>x.length>size?recursive(x):[x]);
   }
  }
  return [t.slice(0,size)];
 }
 const rec=recursive(body);
 return {
  encoded:`Chunk size: ${size}, overlap: ${overlap}\n\nFixed-size chunks (${chunks.length}):\n${chunks.map((c,i)=>`  [${i+1}] (${c.length}) ${c.slice(0,60)}${c.length>60?'…':''}`).join('\n')}\n\nRecursive chunks (${rec.length}):\n${rec.map((c,i)=>`  [${i+1}] (${c.length}) ${c.slice(0,60)}${c.length>60?'…':''}`).join('\n')}`,
  decoded:`Fixed-size chunking is simple but can cut sentences. Recursive splitting prefers paragraph and sentence boundaries. Overlap prevents information loss at boundaries.`
 };
}

/* 10 RAG */
function demoRag(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter the question on the first line, then the documents.');
 const query=lines[0];
 const docs=lines.slice(1);
 // Retrieve with simple term overlap + length penalty
 function score(q,d){
  const qt=new Set(tokenize(q,true,true));
  const dt=new Set(tokenize(d,true,true));
  if(!qt.size)return 0;
  let overlap=0;
  for(const t of qt)if(dt.has(t))overlap++;
  return overlap/qt.size * (1+1/(1+Math.log(1+dt.size)));
 }
 const ranked=docs.map((d,i)=>[i,score(query,d)]).sort((a,b)=>b[1]-a[1]);
 const topK=ranked.slice(0,3);
 // Extractive answer with citations
 function answer(q,passages){
  const qt=new Set(tokenize(q,true,true));
  let best={score:-1,text:'',passage:-1};
  for(const [pi,passage] of passages){
   const sents=sentences(passage);
   for(const s of sents){
    const st=new Set(tokenize(s,true,true));
    let overlap=0;
    for(const t of qt)if(st.has(t))overlap++;
    const sc=overlap/qt.size;
    if(sc>best.score)best={score:sc,text:s,passage:pi};
   }
  }
  return best;
 }
 const ans=answer(query,topK.map(([i])=>[i,docs[i]]));
 const answerText=ans.passage>=0?`${ans.text} [${topK.findIndex(([i])=>i===ans.passage)+1}]`:'(no answer found)';
 return {
  encoded:`Question: ${query}\n\nRanked documents:\n${ranked.map(([i,s],r)=>`  ${r+1}. Doc ${i+1} (score ${fmtNum(s,3)}): ${docs[i]}`).join('\n')}\n\nTop-3 passages given to the LLM:\n${topK.map(([i,s],r)=>`  [${r+1}] Doc ${i+1}: ${docs[i]}`).join('\n')}\n\nGenerated answer (extractive with citation):\n  ${answerText}`,
  decoded:`RAG retrieves top-K passages, optionally reranks, then conditions the LLM on the passages. The answer here is extractive with citations; a real system would use an LLM to generate.`
 };
}

/* 10 RAG evaluation */
function demoRagEval(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 if(lines.length<2)throw Error('Enter relevant doc IDs on the first line, retrieved doc IDs on the second.');
 const relevant=lines[0].split(/[\s,]+/).filter(Boolean).map(Number);
 const retrieved=lines[1].split(/[\s,]+/).filter(Boolean).map(Number);
 function precision(k){return retrieved.slice(0,k).filter(d=>relevant.includes(d)).length/k}
 function recall(k){return retrieved.slice(0,k).filter(d=>relevant.includes(d)).length/Math.max(1,relevant.length)}
 function mrr(){
  for(let i=0;i<retrieved.length;i++)if(relevant.includes(retrieved[i]))return 1/(i+1);
  return 0;
 }
 function dcg(k){let s=0;for(let i=0;i<Math.min(k,retrieved.length);i++){if(relevant.includes(retrieved[i]))s+=1/Math.log2(i+2)}return s}
 function ndcg(k){
  const ideal=Math.min(relevant.length,k);
  let idcg=0;for(let i=0;i<ideal;i++)idcg+=1/Math.log2(i+2);
  return idcg>0?dcg(k)/idcg:0;
 }
 const ks=[1,3,5,10].filter(k=>k<=retrieved.length);
 const rows=ks.map(k=>`  k=${k}: P=${fmtNum(precision(k),3)}, R=${fmtNum(recall(k),3)}, NDCG=${fmtNum(ndcg(k),3)}`);
 return {
  encoded:`Relevant: [${relevant.join(', ')}]\nRetrieved: [${retrieved.join(', ')}]\n\nMetrics:\n${rows.join('\n')}\n  MRR = ${fmtNum(mrr(),4)}\n\nNote: RAG evaluation should also cover answer quality (faithfulness, relevance, completeness).`,
  decoded:`Precision@k is the fraction of top-k that is relevant. Recall@k is the fraction of relevant documents found. MRR is the reciprocal rank of the first relevant. NDCG rewards relevant documents at the top.`
 };
}

   Lab dispatcher

function runLab(l,initial){
 const input=$('#labInput').value;
 let res;
 try{
  if(!initial){$('#labEncoded').textContent='Running…';$('#labDecoded').textContent=''}
  switch(l.demo){

   case'naive-bayes':res=demoNaiveBayes(input);break;
   case'viterbi':res=demoViterbi(input);break;
   case'tfidf':res=demoTfidf(input);break;
   case'textrank':res=demoTextrank(input);break;
   case'lda':res=demoLda(input);break;
   case'cyk':res=demoCyk(input);break;
   case'inverted-index':res=demoInvertedIndex(input);break;
   case'bm25':res=demoBm25(input);break;
   case'dense-embeddings':res=demoDenseEmbeddings(input);break;
   case'cross-encoder':res=demoCrossEncoder(input);break;
   case'extractive-qa':res=demoExtractiveQa(input);break;
   case'chunking':res=demoChunking(input);break;
   case'rag':res=demoRag(input);break;
   case'rag-eval':res=demoRagEval(input);break;
   default:throw Error('No interactive implementation is available for this lesson.');
  }
 }catch(e){
  res={encoded:'Input or runtime error',decoded:e.message};
 }
 const el=$('#labEncoded');
 if(res.html){el.innerHTML=res.html+'\n\n'+res.encoded}else{el.textContent=res.encoded}
 $('#labDecoded').textContent=res.decoded;
 if(!initial)toast('Lab complete');
}

/* ============================================================
   State and shell
   ============================================================ */
const state={page:'home',current:null,completed:new Set(),bookmarks:new Set(),theme:'system',drafts:{}};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1900)}
function save(){try{localStorage.setItem('az-nlp-ir-lab-v1',JSON.stringify({schemaVersion:1,completed:[...state.completed],bookmarks:[...state.bookmarks],theme:state.theme,current:state.current,drafts:state.drafts}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('az-nlp-ir-lab-v1')||'null');if(!d||d.schemaVersion!==1)return;
 state.completed=new Set((d.completed||[]).filter(id=>byId[id]));
 state.bookmarks=new Set((d.bookmarks||[]).filter(id=>byId[id]));
 state.theme=['system','light','dark'].includes(d.theme)?d.theme:'system';
 state.current=byId[d.current]?d.current:null;
 state.drafts=d.drafts&&typeof d.drafts==='object'?d.drafts:{};}catch(e){}}
function applyTheme(){let t=state.theme;if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;$('#themeSelect').value=state.theme}
function getChapter(id){return CHAPTERS.find(c=>c.ids.includes(id))||CHAPTERS[0]}
function progress(){
 const n=state.completed.size,t=LESSONS.length;
 $('#progressText').textContent=`${n} / ${t}`;
 $('#progressFill').style.width=(n/t*100)+'%';
 $('#lessonCount').textContent=t+' lessons';
 $('#catalogCount').textContent=`${CHAPTERS.length} chapters · ${t} lessons · ${LESSONS.filter(l=>l.demo&&l.demo!=='none').length} labs`;
 $('#progressBar').setAttribute('aria-valuenow',String(Math.round(n/t*100)));
}
function renderTree(){
 const q=$('#searchInput').value.toLowerCase().trim(),ch=$('#chapterFilter').value;
 const root=$('#courseTree');root.textContent='';
 for(const c of CHAPTERS){
  if(ch!=='all'&&c.id!==ch)continue;
  const rows=c.ids.map(id=>byId[id]).filter(x=>x&&(!q||(x.title+' '+x.summary+' '+x.kind+' '+c.title).toLowerCase().includes(q)));
  if(!rows.length)continue;
  const group=document.createElement('section');
  const label=document.createElement('div');label.className='group-label';
  label.innerHTML=`<span>${esc(c.title)}</span><span>${rows.length}</span>`;
  group.append(label);
  rows.forEach(l=>{
   const b=document.createElement('button');b.type='button';
   b.className='link'+(state.current===l.id?' active':'');
   b.dataset.lesson=l.id;
   b.innerHTML=`<span class="num">${String(LESSONS.indexOf(l)+1).padStart(2,'0')}</span><span class="name">${esc(l.title)}</span>${state.completed.has(l.id)?'<span class="done" aria-label="completed">✓</span>':''}`;
   group.append(b);
  });
  root.append(group);
 }
 if(!root.children.length)root.innerHTML='<p class="muted">No matching lessons. Try another search.</p>';
 progress();
}
function listToHTML(a){return `<ol class="steps">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`}
function refsHTML(r){return r&&r.length?`<div class="references">${r.map(x=>`<a target="_blank" rel="noopener noreferrer" href="${esc(x[1])}">${esc(x[0])} ↗</a>`).join('')}</div>`:'<p class="muted">See the recommended textbooks and papers for a full treatment.</p>'}
function codeRecord(l){if(l.codeKey==='none')return null;return CODE[l.codeKey]||CODE[l.demo]||null}
function codeText(l){
 const c=codeRecord(l);
 if(c&&c.python)return c.python;
 return '# CONCEPT OUTLINE, NOT EXECUTABLE PYTHON\n# Lesson: '+l.title+'\n\n# Core idea\n# '+String(l.summary||'').replace(/\n/g,'\n# ')+'\n\n# Pseudocode from the lesson\n'+String(l.pseudo||'').split('\n').map(x=>'# '+x).join('\n')+'\n';
}
function statusClass(l){return /Runnable/.test(l.status)?'good':'warn'}

function renderLesson(id){
 const l=byId[id];if(!l){renderHome();return}
 state.page='lesson';state.current=id;
 const c=getChapter(id);const index=LESSONS.indexOf(l);const next=LESSONS[(index+1)%LESSONS.length];
 const hasDemo=l.demo&&l.demo!=='none';
 const demoArea=hasDemo?`<section class="panel"><div class="panel-head"><h2>${esc(l.demoTitle||'Interactive teaching lab')}</h2><p>Everything runs in your browser. This is a teaching implementation, not a production library.</p></div><div class="body"><div class="lab-top"><label for="labInput">Input</label><button class="btn" id="resetSample">Reset sample</button><button class="btn primary" id="runLab">Run lab</button></div><textarea class="lab-input" id="labInput" aria-label="Lab input">${esc(l.sample||'')}</textarea><div class="notice info"><strong>Format:</strong> see the sample for the expected format. Most labs take either plain text, one item per line, or a small table.</div><div class="lab-cols"><div><div class="label">Output</div><div class="lab-output" id="labEncoded">Run the lab to see output.</div></div><div><div class="label">Explanation</div><div class="lab-output" id="labDecoded">Step notes appear here.</div></div></div></div></section>`:'';
 const references=refsHTML(l.refs);
 const code=state.drafts[id]??codeText(l);
 $('#mainView').innerHTML=`<div class="breadcrumb">NLP &amp; Information Retrieval Lab / ${esc(c.title)}</div>
<header class="header">
 <div class="eyebrow">LESSON ${String(index+1).padStart(2,'0')} · ${esc(l.kind)}</div>
 <h1>${esc(l.title)}</h1>
 <p>${esc(l.summary)}</p>
 <div class="tags"><span class="tag">Level ${l.level}</span><span class="tag ${statusClass(l)}">${esc(l.status)}</span><span class="tag">${esc(c.title.replace(/^\d+(\.\d+)?\s*/,''))}</span></div>
 <div class="header-actions">
  <button class="btn" id="bookmarkBtn">${state.bookmarks.has(id)?'★ Bookmarked':'☆ Bookmark'}</button>
  <button class="btn primary" id="completeBtn">${state.completed.has(id)?'✓ Completed':'Mark complete'}</button>
 </div>
</header>
<section class="panel"><div class="panel-head"><h2>1. Understand the idea</h2><p>Plain language and a mental picture</p></div><div class="body idea"><div><p>${esc(l.summary)}</p><p><strong>What problem it solves:</strong> ${esc(l.problem)}</p><div class="takeaway"><strong>Takeaway:</strong> ${esc(l.output)}</div></div><aside class="mental"><small>Mental picture</small><strong>${esc(l.mental)}</strong><p>${esc(l.mentalText)}</p></aside></div></section>
<section class="panel"><div class="panel-head"><h2>2. Input and output</h2><p>Know what goes in and what comes out</p></div><div class="body two"><div class="mini"><h3>Input</h3><p>${esc(l.input)}</p></div><div class="mini"><h3>Output</h3><p>${esc(l.output)}</p></div></div></section>
<section class="panel"><div class="panel-head"><h2>3. How it works</h2><p>Step by step, with the key rule that makes it correct</p></div><div class="body two"><div>${listToHTML(l.steps)}<div class="takeaway" style="margin-top:14px"><strong>Key rule:</strong> ${esc(l.invariant)}</div></div><pre class="pseudo">${esc(l.pseudo)}</pre></div><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Step</th><th>What happens</th><th>Why it matters</th></tr></thead><tbody>${l.trace.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
${demoArea}
<section class="panel"><div class="panel-head"><h2>4. Cost and stability</h2><p>Costs depend on corpus size, vocabulary and model. These are scope labels, not universal benchmarks.</p></div><div class="body"><div class="tiles">${l.complexity.map((x,i)=>`<div class="tile"><span>${['Time','Space','Interpretation'][i]}</span><strong>${esc(x.split(' ').slice(0,2).join(' '))}</strong><small>${esc(x)}</small></div>`).join('')}</div><div class="two" style="margin-top:12px"><div class="mini"><h3>Strengths</h3><p>${esc(l.strength)}</p></div><div class="mini"><h3>Limits</h3><p>${esc(l.limits)}</p></div></div></div></section>
<section class="panel"><div class="panel-head"><h2>5. Code and usage</h2><p>Reference code is for learning. Real code should use a vetted library.</p></div><div class="code-head"><div><span class="tag">${codeRecord(l)?'Python example':'Concept outline, not executable'}</span> <span class="tag">Editable</span></div><div class="header-actions" style="margin:0"><button class="btn" id="copyCode">Copy code</button><button class="btn" id="downloadCode">Download</button></div></div><textarea id="codeEditor" class="code-editor" spellcheck="false" aria-label="Editable Python code">${esc(code)}</textarea><div class="code-foot"><span>${codeRecord(l)?'Reference example. The in-page lab runs its own JavaScript implementation.':'Lesson-specific outline, not an implementation.'}</span><span id="codeStatus">Local draft</span></div><div class="body"><div class="mini"><h3>Where it is used</h3><p>${esc(l.uses)}</p></div><div class="notice" style="margin-top:12px"><strong>Common pitfall:</strong> ${esc(l.pitfall)}</div></div></section>
<section class="panel"><div class="panel-head"><h2>6. Choices and alternatives</h2><p>Pick based on the task, language and required quality</p></div><div class="body two"><div class="mini"><h3>When to use this</h3><p>${esc(l.strength)}</p></div><div class="mini"><h3>When to use something else</h3><p>${esc(l.limits)}</p></div></div></section>
<section class="panel"><div class="panel-head"><h2>7. Check yourself</h2><p>Try to answer before you open the explanation</p></div><div class="body"><details class="practice"><summary>${esc(l.question)}</summary><p>${esc(l.answer)}</p></details></div></section>
<section class="panel"><div class="panel-head"><h2>8. References</h2><p>Standard references for this topic</p></div><div class="body">${references}<p class="muted" style="font-size:11.5px;margin-top:14px">The labs on this page are teaching implementations. For production work use spaCy, Hugging Face Transformers, sentence-transformers, rank_bm25, scikit-learn, Gensim, Lucene, Elasticsearch, FAISS, or another vetted library.</p></div></section>
<footer class="footer"><span>Az NLP &amp; Information Retrieval Lab · local learning</span><span>Lesson ${index+1} of ${LESSONS.length} · Next: ${esc(next.title)}</span><button class="btn" id="nextLesson">Next →</button></footer>`;

 $('#bookmarkBtn').onclick=()=>{state.bookmarks.has(id)?state.bookmarks.delete(id):state.bookmarks.add(id);save();renderLesson(id);toast(state.bookmarks.has(id)?'Bookmarked':'Bookmark removed')};
 $('#completeBtn').onclick=()=>{state.completed.has(id)?state.completed.delete(id):state.completed.add(id);save();renderTree();renderLesson(id);toast(state.completed.has(id)?'Lesson completed':'Completion removed')};
 $('#nextLesson').onclick=()=>openLesson(next.id);
 $('#copyCode').onclick=async()=>{const v=$('#codeEditor').value;try{await navigator.clipboard.writeText(v);toast('Code copied')}catch{const ta=$('#codeEditor');ta.select();document.execCommand('copy');toast('Code copied')}};
 $('#downloadCode').onclick=()=>{const r=codeRecord(l);downloadText(`${id}.${r?'py':'txt'}`,$('#codeEditor').value,r?'text/x-python':'text/plain')};
 $('#codeEditor').addEventListener('input',()=>{state.drafts[id]=$('#codeEditor').value;save();$('#codeStatus').textContent='Draft saved locally'});
 if(hasDemo){
  $('#runLab').onclick=()=>runLab(l);
  $('#resetSample').onclick=()=>{$('#labInput').value=l.sample||'';$('#labEncoded').textContent='Run the lab to see output.';$('#labDecoded').textContent='Step notes appear here.'};
  runLab(l,true);
 }
 renderTree();save();
 if(location.hash!==`#${id}`)history.replaceState(null,'',`#${id}`);
}

function renderHome(){
 state.page='home';
 $('#mainView').innerHTML=`<div class="home-hero"><div class="eyebrow">AZ · NLP AND IR TOOLBOOK</div><h1>Understand NLP and information retrieval from tokenization to retrieval-augmented generation.</h1><p>A single-file course covering text preparation, tokenization algorithms, language models, classification and labeling, topics and key phrases, parsing, search indexes, semantic retrieval, reranking and question answering, and modern RAG. Every lesson has a plain explanation and most have a runnable lab.</p><div class="header-actions" style="margin:0"><button class="btn primary" id="startFirst">Start at the beginning</button><button class="btn" id="resumeLesson">Continue lesson</button></div></div>
<div class="stats"><div class="stat"><strong>${CHAPTERS.length}</strong><span>chapters</span></div><div class="stat"><strong>${LESSONS.length}</strong><span>lessons</span></div><div class="stat"><strong>${LESSONS.filter(l=>l.demo&&l.demo!=='none').length}</strong><span>runnable labs</span></div><div class="stat"><strong>1</strong><span>standalone HTML file</span></div></div>
<section class="panel"><div class="panel-head"><h2>Honest scope</h2><p>One app covers the whole curriculum. Production NLP/IR systems are a separate engineering project.</p></div><div class="body two"><div class="mini"><h3>What runs here</h3><p>Sentence splitting and tokenization, simplified Porter stemming, BPE training and merging, WordPiece greedy tokenization, bigram language models with Laplace smoothing and perplexity, co-occurrence word embeddings, Naive Bayes text classification, HMM Viterbi decoding, TF-IDF weighting, TextRank keyword extraction, LDA collapsed Gibbs sampling, CYK constituency parsing, inverted index and Boolean retrieval, BM25 ranking, random-projection dense retrieval, cross-encoder reranking surrogate, extractive QA span scoring, fixed and recursive chunking, RAG retrieval with citations, and retrieval evaluation (precision, recall, MRR, NDCG).</p></div><div class="mini"><h3>What does not run here</h3><p>Production tokenizers (HuggingFace, SentencePiece), large pretrained language models, trained word2vec/GloVe/fastText, trained CRFs, dependency and constituency parsers with neural models, learning-to-rank (LambdaMART), cross-encoders, dense encoders (DPR, E5), ANN indexes (FAISS, HNSW), and full RAG systems with LLMs. For real work use spaCy, Hugging Face Transformers, sentence-transformers, rank_bm25, scikit-learn, Gensim, Lucene, Elasticsearch, FAISS, or another vetted library.</p></div></div></section>
<div class="panel"><div class="panel-head"><h2>Course map</h2><p>Pick a chapter. The path runs from text preparation to retrieval-augmented generation.</p></div><div class="body"><div class="chapter-cards">${CHAPTERS.map((c,i)=>`<button class="chapter-card" data-chapter="${c.id}"><span class="num">CHAPTER ${String(i+1).padStart(2,'0')} · ${c.ids.length} LESSONS</span><strong>${esc(c.title.replace(/^\d+(\.\d+)?\s*/,''))}</strong><p>${esc(c.desc)}</p></button>`).join('')}</div></div></div>
<footer class="footer"><span>Az NLP &amp; Information Retrieval Lab</span><span>Single file · no external runtime dependencies</span></footer>`;
 $('#startFirst').onclick=()=>openLesson('text-prep');
 $('#resumeLesson').onclick=()=>openLesson(state.current&&byId[state.current]?state.current:'text-prep');
 $('#mainView').querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{const c=CHAPTERS.find(x=>x.id===b.dataset.chapter);if(c)openLesson(c.ids[0])});
}

function renderProgressPage(){
 state.page='progress';
 $('#mainView').innerHTML=`<div class="breadcrumb">NLP &amp; IR Lab / Bookmarks & progress</div><header class="header"><div class="eyebrow">LOCAL ONLY</div><h1>Bookmarks and progress</h1><p>Your progress stays in this browser. Export the JSON to move it or keep a backup.</p></header>
<section class="panel"><div class="panel-head"><h2>Completed lessons</h2></div><div class="body">${state.completed.size?`<div class="references">${[...state.completed].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No lessons marked complete yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Bookmarks</h2></div><div class="body">${state.bookmarks.size?`<div class="references">${[...state.bookmarks].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No bookmarks yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Progress data</h2></div><div class="body"><div class="header-actions" style="margin:0"><button class="btn primary" id="exportProgress">Export progress JSON</button><button class="btn" id="clearProgress">Clear completion marks</button></div><p class="muted" style="font-size:12.5px;margin-top:14px">Import accepts only known lesson IDs and a supported schema version.</p></div></section>`;
 $('#mainView').querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();openLesson(a.dataset.open)});
 $('#exportProgress').onclick=exportProgress;
 $('#clearProgress').onclick=()=>{if(confirm('Clear all completion marks?')){state.completed.clear();save();renderProgressPage();renderTree();toast('Completion marks cleared')}};
}

function openLesson(id){if(!byId[id])return;renderLesson(id);renderTree();$('#mainView').focus({preventScroll:true});window.scrollTo(0,0)}
function downloadText(name,text,type='text/plain'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800)}
function exportProgress(){downloadText('az-nlp-ir-lab-progress.json',JSON.stringify({schemaVersion:1,completed:[...state.completed],bookmarks:[...state.bookmarks],theme:state.theme,current:state.current,drafts:state.drafts},null,2),'application/json');toast('Progress exported')}
function importProgressFile(file){
 if(file.size>2_000_000){toast('Import rejected: file too large');return}
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);
  if(!d||d.schemaVersion!==1||!Array.isArray(d.completed)||!Array.isArray(d.bookmarks)||typeof d.drafts!=='object')throw Error('bad schema');
  if([...d.completed,...d.bookmarks].some(id=>typeof id!=='string'||!byId[id]))throw Error('unknown id');
  state.completed=new Set(d.completed);
  state.bookmarks=new Set(d.bookmarks);
  state.theme=['system','light','dark'].includes(d.theme)?d.theme:'system';
  state.current=byId[d.current]?d.current:null;
  state.drafts=Object.fromEntries(Object.entries(d.drafts).filter(([k,v])=>byId[k]&&typeof v==='string'&&v.length<100000));
  applyTheme();save();renderTree();
  state.current?openLesson(state.current):renderHome();
  toast('Progress imported');
 }catch(e){toast('Import rejected: invalid progress data')}};
 r.readAsText(file);
}

function bindGlobal(){
 $('#themeSelect').onchange=()=>{state.theme=$('#themeSelect').value;applyTheme();save()};
 $('#printBtn').onclick=()=>print();
 $('#exportBtn').onclick=exportProgress;
 $('#importBtn').onclick=()=>$('#importFile').click();
 $('#importFile').onchange=e=>{if(e.target.files[0])importProgressFile(e.target.files[0]);e.target.value=''};
 $('#searchInput').oninput=renderTree;
 $('#chapterFilter').onchange=renderTree;
 $('#homeLink').onclick=e=>{e.preventDefault();renderHome();history.replaceState(null,'','#home')};
 $('#courseTree').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)openLesson(b.dataset.lesson)};
 document.querySelectorAll('[data-page="home"]').forEach(b=>b.onclick=renderHome);
 document.querySelectorAll('[data-page="progress"]').forEach(b=>b.onclick=renderProgressPage);
 document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#searchInput').focus()}
  if(e.key.toLowerCase()==='t'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
   state.theme=state.theme==='dark'?'light':state.theme==='light'?'system':'dark';
   applyTheme();save();
  }
 });
}

function init(){
 load();
 applyTheme();
 CHAPTERS.forEach(c=>{const op=document.createElement('option');op.value=c.id;op.textContent=c.title;$('#chapterFilter').append(op)});
 bindGlobal();
 renderTree();
 const hash=location.hash.replace(/^#/,'');
 if(hash&&byId[hash])renderLesson(hash);
 else if(state.current&&byId[state.current])renderLesson(state.current);
 else renderHome();
 progress();
}
init();
</script></body></html>
