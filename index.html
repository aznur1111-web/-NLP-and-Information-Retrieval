 pitfall:"Applying lemmatization without POS tags gives wrong results for words like 'meeting' (noun vs verb).",
 question:"What is the difference between stemming and lemmatization?",
 answer:"Stemming uses suffix rules and may produce non-words. Lemmatization uses a dictionary and morphology to return a real base form.",
 demo:"stemming",sample:"running runs ran runner happiness studies studying better was",refs:[
  ["Porter, An algorithm for suffix stripping, Program 1980","https://doi.org/10.1108/eb046814"],
  ["Manning, Raghavan, Schütze, Introduction to Information Retrieval, Ch. 2","https://nlp.stanford.edu/IR-book/"],
  ["Jurafsky and Martin, SLP 3rd ed., Ch. 2","https://web.stanford.edu/~jurafsky/slp3/"]]},
{id:"language-detection",title:"Language detection",level:3,kind:"Classification",status:"Concept lesson",
 summary:"Language detection identifies the language of a text. Character n-gram profiles and short word lists work well for long text; short text is harder.",
 mental:"Which language's character statistics match this text?",
 mentalText:"Build a profile of character n-grams per language. Score the input against each profile. The best match wins.",
 steps:["Build or load character n-gram profiles per language.","Compute the n-gram profile of the input.","Score each language by similarity (cosine, out-of-place).","Return the top language and optionally a confidence."],
 pseudo:"Cavnar-Trenkle (1994):\n  for each language L:\n    profile[L] = top 300-400 character n-grams by frequency\n  score(L, text) = sum over n-grams of |rank_L(g) - rank_text(g)|\n  return argmin_L score(L, text)\n\nModern:\n  fastText lid.176 (176 languages, 0.5 MB)\n  CLD3 (Google, char n-gram + neural)\n  langid.py (naive Bayes over byte n-grams)\n\nShort text is hard:\n  \"yes\" could be English, German, Spanish, ...\n  use context, metadata, or a user setting\n\nMixing languages:\n  code-switching needs per-token detection",
 invariant:"The method assumes the text is long enough to have a distinctive character distribution. Short text is unreliable.",
 uses:"Web crawling, search, translation routing, content moderation.",
 strength:"Fast, no training, works for long text.",
 limits:"Fails on short text, code-switching, transliteration, and closely related languages.",
 pitfall:"Detecting on a single word gives wrong results. Use a minimum length or fall back to a default.",
 question:"How long should a text be for reliable language detection?",
 answer:"About 20+ characters for character n-gram methods. Below 10 characters, accuracy drops sharply.",
 demo:"none",sample:"",refs:[
  ["Cavnar and Trenkle, N-gram-based text categorization, SDAIR 1994","https://www.researchgate.net/publication/2375540_N-Gram-Based_Text_Categorization"],
  ["Joulin et al., FastText.zip: Compressing text classification models, ICLR 2017","https://arxiv.org/abs/1612.03651"],
  ["Jurafsky and Martin, SLP 3rd ed., Ch. 2","https://web.stanford.edu/~jurafsky/slp3/"]]},
/* ================= 2 Tokenization algorithms ================= */
{id:"bpe",title:"Byte-pair encoding (BPE)",level:3,kind:"Subword",status:"Runnable teaching lab",
 summary:"BPE builds a subword vocabulary by iteratively merging the most frequent adjacent pair of symbols. It balances vocabulary size and coverage, and handles rare words via subword units.",
 mental:"Start with characters, merge the most frequent pair, repeat",
 mentalText:"Each word starts as a sequence of characters. Count pairs across the corpus. Merge the most frequent pair into a new symbol. Repeat k times. The result is a vocabulary of characters plus k merges.",
 steps:["Split the corpus into words (with word boundary markers).","Represent each word as a sequence of characters.","Count adjacent pairs across all words.","Merge the most frequent pair into a new symbol.","Repeat k times.","Tokenize new text by applying the merges in order."],
 pseudo:"Training BPE:\n  vocab = all characters in the corpus\n  for i in 1..k:\n    counts = count all adjacent pairs in the current word representations\n    best = argmax counts\n    merge best in every word\n    vocab.add(merged_symbol)\n\nTokenizing new text:\n  word = list(word) + ['</w>']\n  while True:\n    pairs = adjacent pairs in word\n    candidates = pairs that are in the merge table\n    if none: break\n    merge the candidate with the lowest merge index\n  return word\n\nUsed in:\n  GPT-2 (byte-level BPE, 50k vocab)\n  RoBERTa (byte-level BPE, 50k)\n  BART, GPT-3, GPT-4\n\nByte-level BPE:\n  start from bytes, not Unicode characters\n  no UNK token; every text is representable",
 invariant:"Merges are ordered. The tokenizer must apply them in the same order as training.",
 uses:"Every modern neural NLP model. GPT, RoBERTa, BART, LLaMA.",
 strength:"Fixed vocabulary, no UNK, handles rare words, multilingual.",
 limits:"Merges are greedy and frequency-based; they do not optimize for downstream tasks.",
 pitfall:"Different BPE training produces different tokenizations. Never mix tokenizers across models.",
 question:"How many merges does GPT-2 use?",
 answer:"About 50,000 merges (plus the initial 256 byte symbols). The vocabulary is about 50,257 tokens.",
 demo:"bpe",sample:"20\nlow low low low low lower lower newest newest newest newest newest widest widest widest",refs:[
  ["Sennrich, Haddow, Birch, Neural machine translation of rare words with subword units, ACL 2016","https://arxiv.org/abs/1508.07909"],
  ["Radford et al., Language models are unsupervised multitask learners (GPT-2), 2019","https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf"],
  ["Kudo and Richardson, SentencePiece, EMNLP 2018","https://arxiv.org/abs/1808.06226"]]},
{id:"wordpiece-unigram",title:"WordPiece and Unigram LM",level:4,kind:"Subword",status:"Runnable teaching lab",
 summary:"WordPiece builds a vocabulary by merging pairs that maximize the likelihood of the corpus (not raw frequency). Unigram LM starts with a large vocabulary and prunes tokens that least hurt the likelihood.",
 mental:"Merge pairs that maximize likelihood; prune tokens that hurt least",
 mentalText:"WordPiece: merge the pair whose merge increases the corpus likelihood the most. Unigram: start big, repeatedly remove tokens to minimize the likelihood loss.",
 steps:["WordPiece: start from characters, score each candidate merge by likelihood gain, merge the best.","Unigram: start from a large seed vocabulary, compute the EM likelihood, remove the tokens whose removal hurts least.","Tokenize new text: WordPiece uses greedy longest match; Unigram uses Viterbi over the vocabulary."],
 pseudo:"WordPiece merge score:\n  score(pair) = freq(pair) / (freq(first) * freq(second))\n  merge the pair with the highest score\n\nUnigram LM training (EM):\n  initialize vocabulary (e.g. all substrings up to length 16)\n  repeat:\n    E-step: compute the expected counts of each token\n    M-step: update the token probabilities\n    prune the tokens with the smallest loss (e.g. 80% -> 20% -> 0%)\n\nTokenization:\n  WordPiece: greedy longest match, left to right\n  Unigram: Viterbi over the lattice of possible segmentations\n\nUsed in:\n  BERT (WordPiece, 30k)\n  ALBERT, DistilBERT, ELECTRA\n  T5, mT5, ALBERT (SentencePiece Unigram)",
 invariant:"The vocabulary must include all characters or bytes. Otherwise UNK tokens appear.",
 uses:"BERT, T5, multilingual models, SentencePiece pipelines.",
 strength:"WordPiece is likelihood-driven; Unigram gives probabilistic tokenization.",
 limits:"Both need a large corpus. Training is slower than BPE.",
 pitfall:"WordPiece greedy longest match is not globally optimal. Unigram Viterbi finds the best segmentation.",
 question:"What is the difference between BPE and WordPiece?",
 answer:"BPE merges the most frequent pair. WordPiece merges the pair that maximizes the likelihood of the corpus (frequency divided by the product of individual frequencies).",
 demo:"wordpiece",sample:"low lower newest widest\nlowest",refs:[
  ["Schuster and Nakajima, Japanese and Korean voice search (WordPiece), ICASSP 2012","https://doi.org/10.1109/ICASSP.2012.6289079"],
  ["Kudo, Subword regularization, ACL 2018","https://arxiv.org/abs/1804.10959"],
  ["Devlin et al., BERT, NAACL 2019","https://arxiv.org/abs/1810.04805"]]},
{id:"sentencepiece",title:"SentencePiece",level:4,kind:"Subword",status:"Concept lesson",
 summary:"SentencePiece trains subword tokenizers directly on raw text without pre-tokenization. It treats the input as a stream of Unicode characters and supports BPE and Unigram.",
 mental:"Subword tokenization without a separate tokenizer",
 mentalText:"SentencePiece replaces spaces with a special meta symbol (▁) and works on the raw stream. The model is reversible: decode gives back the original text.",
 steps:["Normalize the raw text (optional).","Replace spaces with a meta symbol.","Train BPE or Unigram on the character stream.","Encode: apply the model. Decode: reverse the meta symbol."],
 pseudo:"SentencePiece:\n  replace ' ' with '▁'\n  train BPE or Unigram on the stream\n  the vocabulary contains pieces like '▁the', 'ing', '▁a'\n\nEncoding:\n  tokenizer.encode('Hello world') -> ['▁Hello', '▁world']\n\nDecoding:\n  tokenizer.decode(['▁Hello', '▁world']) -> 'Hello world'\n\nAdvantages:\n  language-independent: no pre-tokenizer\n  reversible: decode(encode(x)) == x\n  handles CJK, Thai, emoji\n\nUsed in:\n  T5, mT5, ALBERT, XLNet, LLaMA, Mistral\n  Google's multilingual models",
 invariant:"The meta symbol must be distinct from any real character. SentencePiece uses U+2581 (▁).",
 uses:"Multilingual models, T5, LLaMA, Mistral, any model that needs a language-agnostic tokenizer.",
 strength:"Language-independent, reversible, simple pipeline.",
 limits:"The meta symbol adds tokens. The vocabulary must include it.",
 pitfall:"Splitting on spaces before SentencePiece defeats the purpose. Use it on the raw text.",
 question:"Why does SentencePiece use the ▁ symbol?",
 answer:"It marks word boundaries in a language-independent way. After decoding, ▁ is replaced by a space.",
 demo:"none",sample:"",refs:[
  ["Kudo and Richardson, SentencePiece: A simple and language independent subword tokenizer, EMNLP 2018","https://arxiv.org/abs/1808.06226"],
  ["Raffel et al., Exploring the limits of transfer learning with T5, JMLR 2020","https://arxiv.org/abs/1910.10683"],
  ["SentencePiece repository","https://github.com/google/sentencepiece"]]},
/* ================= 3 Language models ================= */
{id:"ngram-lm",title:"n-gram language models and perplexity",level:3,kind:"Language model",status:"Runnable teaching lab",
 summary:"An n-gram model predicts the next word from the previous n-1 words. It is simple, fast and a strong baseline. Perplexity measures how surprised the model is by a test corpus.",
 mental:"Predict the next word from the last n-1 words",
 mentalText:"A bigram model: P(w_t | w_{t-1}) = count(w_{t-1}, w_t) / count(w_{t-1}). Trigram: condition on the last two words. Smoothing handles unseen n-grams.",
 steps:["Tokenize the corpus.","Count n-grams and (n-1)-grams.","Estimate conditional probabilities.","Apply smoothing (Laplace, add-k, Kneser-Ney).","Compute perplexity on a test corpus."],
 pseudo:"Maximum likelihood:\n  P(w_t | w_{t-1}) = count(w_{t-1}, w_t) / count(w_{t-1})\n\nLaplace (add-1) smoothing:\n  P(w_t | w_{t-1}) = (count(w_{t-1}, w_t) + 1) / (count(w_{t-1}) + V)\n  V = vocabulary size\n\nPerplexity:\n  PP(W) = exp(- (1/N) sum log P(w_i | history))\n  lower is better\n  PP = 1 means perfect prediction\n  PP = V means uniform random\n\nKneser-Ney:\n  absolute discounting + continuation counts\n  the standard n-gram smoothing method",
 invariant:"The chain rule factorizes the joint probability into conditionals. The Markov assumption truncates the history.",
 uses:"Speech recognition, MT, spelling correction, keyboard prediction, baselines.",
 strength:"Simple, fast, interpretable, strong baseline.",
 limits:"Sparsity: most n-grams are unseen. Cannot generalize beyond exact matches.",
 pitfall:"Evaluating on the training corpus gives artificially low perplexity. Always use held-out test data.",
 question:"What does a perplexity of 100 mean?",
 answer:"The model is as uncertain as if it were choosing uniformly among 100 equally likely words at each step.",
 demo:"ngram",sample:"2\nthe cat sat on the mat the cat ate the rat the dog sat on the log",refs:[
  ["Jurafsky and Martin, SLP 3rd ed., Ch. 3","https://web.stanford.edu/~jurafsky/slp3/"],
  ["Chen and Goodman, An empirical study of smoothing techniques for language modeling, Computer Speech & Language 1999","https://doi.org/10.1006/csla.1999.0128"],
  ["Kneser and Ney, Improved backing-off for m-gram language modeling, ICASSP 1995","https://doi.org/10.1109/ICASSP.1995.479394"]]},
{id:"smoothing-backoff",title:"Smoothing, backoff and interpolation",level:4,kind:"Language model",status:"Concept lesson",
 summary:"Smoothing redistributes probability mass to unseen events. Backoff uses a shorter context when the full context is unseen. Interpolation mixes estimates from different orders.",
 mental:"Give some probability to unseen n-grams",
 mentalText:"Add-k adds a constant to every count. Katz backoff discounts seen n-grams and backs off to (n-1)-grams. Interpolation always mixes all orders.",
 steps:["Choose a smoothing method.","Estimate probabilities at each order.","Combine via backoff or interpolation.","Tune the discount or interpolation weights on held-out data."],
 pseudo:"Add-k:\n  P(w | h) = (count(h, w) + k) / (count(h) + k V)\n\nKatz backoff:\n  if count(h, w) > 0:\n    P = discount * count(h, w) / count(h)\n  else:\n    P = alpha(h) * P(w | h')\n\nInterpolation:\n  P(w | h) = lambda_3 P_3(w | h) + lambda_2 P_2(w | h) + lambda_1 P_1(w)\n  sum lambda_i = 1\n\nKneser-Ney:\n  absolute discounting D\n  continuation counts for lower orders\n  the best-performing n-gram smoothing\n\nGood-Turing:\n  reestimate counts of count r using N_{r+1} / N_r",
 invariant:"Smoothing must preserve the probability simplex: sum over w of P(w | h) = 1.",
 uses:"Speech recognition, MT, n-gram LMs in production before neural LMs.",
 strength:"Handles sparsity. Backoff is simple. Interpolation is robust.",
 limits:"Neural LMs have largely replaced n-gram LMs for quality, but n-gram models remain useful for latency and memory.",
 pitfall:"Discounting too aggressively gives too much mass to unseen events. Tune on held-out data.",
 question:"What is the difference between backoff and interpolation?",
 answer:"Backoff uses the shorter context only when the longer context is unseen. Interpolation always mixes all orders with learned weights.",
 demo:"none",sample:"",refs:[
  ["Katz, Estimation of probabilities from sparse data, IEEE TASSP 1987","https://doi.org/10.1109/TASSP.1987.1165125"],
  ["Chen and Goodman, An empirical study of smoothing techniques, 1999","https://doi.org/10.1006/csla.1999.0128"],
  ["Jurafsky and Martin, SLP 3rd ed., Ch. 3","https://web.stanford.edu/~jurafsky/slp3/"]]},
{id:"word-embeddings",title:"Word2vec, GloVe and fastText",level:4,kind:"Embeddings",status:"Runnable teaching lab",
 summary:"Word embeddings map words to dense vectors where similar words are close. Word2vec uses skip-gram or CBOW; GloVe uses global co-occurrence; fastText adds subword information.",
 mental:"A vector per word, learned from context",
 mentalText:"Skip-gram: predict the context from the center word. CBOW: predict the center from the context. The learned weights are the embeddings.",
 steps:["Build a vocabulary and a co-occurrence or context dataset.","Train skip-gram, CBOW, or GloVe.","L2-normalize the vectors.","Use cosine similarity for similarity and analogies."],
 pseudo:"Skip-gram objective:\n  maximize sum_{t} sum_{j in window} log P(w_{t+j} | w_t)\n  P(o | c) = exp(v_o . u_c) / sum_w exp(v_w . u_c)\n\nNegative sampling:\n  maximize log sigma(v_o . u_c) + sum_{k in neg} log sigma(-v_k . u_c)\n\nGloVe objective:\n  minimize sum_{i,j} f(X_ij) (w_i . w_j + b_i + b_j - log X_ij)^2\n\nfastText:\n  word vector = sum of its character n-gram vectors\n  handles rare words and morphologically rich languages\n\nAnalogies:\n  king - man + woman ~ queen",
 invariant:"The embedding matrix is learned from co-occurrence. The objective shapes the geometry.",
 uses:"Similarity, clustering, classification features, cross-lingual alignment, retrieval.",
 strength:"Dense, low-dimensional, captures semantic similarity.",
 limits:"Static: one vector per word, no context. Polysemy is not handled. Word2vec and GloVe need a large corpus.",
 pitfall:"Averaging word embeddings gives a bag-of-words representation and loses word order.",
 question:"What is the difference between word2vec and GloVe?",
 answer:"Word2vec is a predictive model (skip-gram or CBOW) trained on local context windows. GloVe is a count-based model trained on global co-occurrence statistics with a weighted least-squares objective.",
 demo:"word-embeddings",sample:"the cat sat on the mat the dog sat on the log the cat ate the rat",refs:[
  ["Mikolov et al., Efficient estimation of word representations in vector space, ICLR 2013","https://arxiv.org/abs/1301.3781"],
  ["Pennington, Socher, Manning, GloVe: Global vectors for word representation, EMNLP 2014","https://nlp.stanford.edu/pubs/glove.pdf"],
  ["Bojanowski et al., Enriching word vectors with subword information, TACL 2017","https://arxiv.org/abs/1607.04606"]]},
/* ================= 4 Classification and labeling ================= */
{id:"naive-bayes",title:"Naive Bayes text classification",level:3,kind:"Classification",status:"Runnable teaching lab",
 summary:"Naive Bayes classifies text by assuming words are independent given the class. Multinomial NB is the standard for text. It is fast, interpretable and a strong baseline.",
 mental:"Count words per class, multiply the probabilities",
 mentalText:"P(class | document) proportional to P(class) * product of P(word | class). Use Laplace smoothing to handle unseen words.",
 steps:["Tokenize and build the vocabulary.","Count word occurrences per class.","Estimate P(word | class) with Laplace smoothing.","Classify a document by argmax of the log posterior."],
 pseudo:"Multinomial Naive Bayes:\n  P(c) = count(c) / N\n  P(w | c) = (count(w, c) + alpha) / (count(c) + alpha V)\n\nClassification:\n  c_hat = argmax_c [ log P(c) + sum_w count(w, d) log P(w | c) ]\n\nAlpha = 1 is Laplace smoothing.\nAlpha < 1 is common for text.\n\nVariants:\n  Bernoulli NB: presence/absence, penalizes absent words\n  Complement NB: for imbalanced classes\n  TF-IDF weighted NB: use tf-idf instead of counts",
 invariant:"The independence assumption is almost always violated, but the classifier still works well in practice.",
 uses:"Spam filtering, sentiment analysis, topic classification, language ID.",
 strength:"Very fast. Works with small data. Interpretable.",
 limits:"Independence assumption. Cannot model word order or interactions.",
 pitfall:"Laplace smoothing with alpha=1 over-smooths for large vocabularies. Use alpha < 1 (e.g. 0.1) for text.",
 question:"Why does Naive Bayes work despite the independence assumption?",
 answer:"The classification decision only needs the argmax. Even if the probabilities are wrong, the ranking of classes is often correct.",
 demo:"naive-bayes",sample:"spam: buy cheap pills now\nspam: cheap loans available\nham: let's meet for lunch tomorrow\nham: project meeting at 3pm",refs:[
  ["Manning, Raghavan, Schütze, Introduction to Information Retrieval, Ch. 13","https://nlp.stanford.edu/IR-book/"],
  ["Jurafsky and Martin, SLP 3rd ed., Ch. 4","https://web.stanford.edu/~jurafsky/slp3/"],
  ["McCallum and Nigam, A comparison of event models for Naive Bayes text classification, AAAI 1998","https://www.cs.cmu.edu/~knigam/papers/multinomial-aaaiws98.pdf"]]},
{id:"linear-svm",title:"Linear SVM and logistic regression for text",level:4,kind:"Classification",status:"Concept lesson",
 summary:"Linear SVMs and logistic regression classify text with a linear decision boundary. Both are strong baselines and interpretable via feature weights.",
 mental:"A hyperplane separating classes in feature space",
 mentalText:"Represent the document as a sparse vector (tf-idf, counts). Learn a weight per feature. The sign of w.x + b gives the class.",
 steps:["Vectorize text (tf-idf or counts).","Train a linear SVM or logistic regression.","Predict on new documents.","Inspect the top-weighted features per class."],
 pseudo:"Linear SVM (hinge loss):\n  minimize (1/2) ||w||^2 + C sum_i max(0, 1 - y_i (w . x_i + b))\n  y in {-1, +1}\n\nLogistic regression (log loss):\n  minimize sum_i log(1 + exp(-y_i (w . x_i + b))) + lambda ||w||^2\n\nSparse features:\n  tf-idf, binary counts, character n-grams\n  10k-1M features is common\n\nRegularization:\n  L2 (ridge): smooth, dense weights\n  L1 (lasso): sparse, feature selection\n  Elastic net: both\n\nLinear models often match or beat deep models\non small or medium text classification tasks.",
 invariant:"The decision boundary is linear in the feature space. Kernel SVMs map to a higher-dimensional space.",
 uses:"Sentiment, spam, topic classification, intent detection, toxicity.",
 strength:"Fast, interpretable, robust with tf-idf features, strong baselines.",
 limits:"Cannot capture non-linear interactions without kernels or feature crosses.",
 pitfall:"Feature scaling matters. tf-idf is usually better than raw counts. Always tune C and the regularizer.",
 question:"Why use tf-idf instead of raw counts for linear models?",
 answer:"tf-idf downweights common words and upweights rare, informative words. This makes the linear boundary more effective.",
 demo:"none",sample:"",refs:[
  ["Joachims, Text categorization with support vector machines, ECML 1998","https://doi.org/10.1007/BFb0026683"],
  ["Fan et al., LIBLINEAR: A library for large linear classification, JMLR 2008","https://www.jmlr.org/papers/v9/fan08a.html"],
  ["Manning, Raghavan, Schütze, Introduction to Information Retrieval, Ch. 13-15","https://nlp.stanford.edu/IR-book/"]]},
{id:"crf-viterbi",title:"CRF, HMM and Viterbi decoding",level:4,kind:"Sequence labeling",status:"Runnable teaching lab",
 summary:"Sequence labeling assigns a label to each token. HMMs model joint probability; CRFs model conditional probability and allow rich features. Viterbi finds the best label sequence in O(n K^2).",
 mental:"Score each label and the transitions between labels",
 mentalText:"For HMM: emissions and transitions. For CRF: arbitrary features of the token and its context. Viterbi fills a table of best scores and back-pointers.",
 steps:["Define states (tags) and observations (tokens).","Define emission and transition scores.","Run Viterbi: fill the DP table.","Backtrack from the best final state."],
 pseudo:"Viterbi (HMM):\n  delta[1, i] = pi_i * b_i(o_1)\n  for t in 2..T:\n    delta[t, j] = max_i delta[t-1, i] * a_ij * b_j(o_t)\n    psi[t, j] = argmax_i delta[t-1, i] * a_ij\n  best = argmax_i delta[T, i]\n  backtrack using psi\n\nCRF:\n  P(y | x) = exp(sum_t sum_k w_k f_k(y_{t-1}, y_t, x, t)) / Z(x)\n  Viterbi with the same DP, using the feature scores\n  training: maximize the conditional log-likelihood\n  often uses L-BFGS with L2 regularization\n\nComplexity: O(T K^2)\n  T = sequence length\n  K = number of tags",
 invariant:"Viterbi is exact for first-order Markov models. Higher-order models need a larger state space.",
 uses:"POS tagging, NER, chunking, shallow parsing, speech recognition, bioinformatics.",
 strength:"Exact, fast, handles dependencies between labels.",
 limits:"First-order Markov assumption. CRF training is slower than HMM.",
 pitfall:"The emission probabilities must cover all observations. Unseen tokens need a UNK emission distribution.",
 question:"What is the difference between HMM and CRF?",
 answer:"HMM is a generative model: it models P(x, y) and assumes observations are independent given the state. CRF is discriminative: it models P(y | x) directly and can use overlapping features.",
 demo:"viterbi",sample:"0.6 0.4\n0.7 0.3\n0.4 0.6\n0.5 0.5\n0.6 0.4\n0.3 0.7\n1.0 0.0\n0 1 0 1 0 1",refs:[
  ["Rabiner, A tutorial on hidden Markov models, Proc. IEEE 1989","https://doi.org/10.1109/5.18626"],
  ["Lafferty, McCallum, Pereira, Conditional random fields, ICML 2001","https://dl.acm.org/doi/10.5555/645530.655813"],
  ["Jurafsky and Martin, SLP 3rd ed., Ch. 8","https://web.stanford.edu/~jurafsky/slp3/"]]},
/* ================= 5 Topics and key phrases ================= */
{id:"tfidf",title:"TF-IDF and term weighting",level:3,kind:"Weighting",status:"Runnable teaching lab",
 summary:"TF-IDF weights terms by term frequency in a document and inverse document frequency across the corpus. It is the workhorse of classic IR and a strong baseline.",
 mental:"Rare terms in a document are informative",
 mentalText:"TF = count of the term in the document. IDF = log(N / df). The product gives high weight to terms that are frequent in one document but rare in the corpus.",
 steps:["Tokenize and (optionally) stem.","Compute TF per document.","Compute DF per term across the corpus.","Multiply TF by log(N / DF).","L2-normalize the document vectors."],
 pseudo:"Term frequency:\n  tf(t, d) = count(t, d)\n  or log(1 + count)\n\nInverse document frequency:\n  idf(t) = log(N / df(t))\n  or log((N + 1) / (df + 1)) + 1  (smooth)\n\nTF-IDF:\n  w(t, d) = tf(t, d) * idf(t)\n\nNormalization:\n  w(t, d) = w(t, d) / sqrt(sum_t w(t, d)^2)\n\nRanking:\n  score(q, d) = sum_{t in q} w(t, q) * w(t, d)\n\nVariants:\n  BM25 (see 7) is a probabilistic TF-IDF\n  sublinear tf: 1 + log(count)\n  max tf normalization: 0.5 + 0.5 count / max_count",
 invariant:"IDF assumes that rare terms are more discriminative. Very common stopwords are downweighted to near zero.",
 uses:"Search ranking, document similarity, keyword extraction, text classification features.",
 strength:"Simple, fast, interpretable, strong baseline.",
 limits:"Bag-of-words: no order, no semantics. Fails on synonyms and polysemy.",
 pitfall:"Computing IDF on the query as well as the documents is inconsistent. IDF must come from the corpus.",
 question:"What does high TF-IDF for a term in a document mean?",
 answer:"The term is frequent in this document but rare across the corpus. It is likely a good discriminator for this document.",
 demo:"tfidf",sample:"the cat sat on the mat\nthe dog sat on the log\nthe cat ate the rat",refs:[
  ["Salton and Buckley, Term-weighting approaches in automatic text retrieval, Information Processing & Management 1988","https://doi.org/10.1016/0306-4573(88)90021-0"],
  ["Manning, Raghavan, Schütze, Introduction to Information Retrieval, Ch. 6","https://nlp.stanford.edu/IR-book/"],
  ["Sparck Jones, A statistical interpretation of term specificity and its application in retrieval, J. Documentation 1972","https://doi.org/10.1108/eb026526"]]},
{id:"textrank",title:"TextRank and keyword extraction",level:4,kind:"Graph ranking",status:"Runnable teaching lab",
 summary:"TextRank builds a graph of words or sentences and runs PageRank. The top-ranked nodes are keywords or summary sentences. It needs no training.",
 mental:"Vote for important words via their neighbors",
 mentalText:"Connect words that co-occur within a window. Run PageRank. Words with high in-links from other high-ranked words win.",
 steps:["Tokenize and (optionally) POS-filter.","Build a co-occurrence graph within a window.","Run PageRank on the graph.","Take the top-K nodes as keywords."],
 pseudo:"Graph construction:\n  for each token i:\n    for each j in window(i):\n      add edge (i, j) with weight 1\n\nPageRank:\n  score(v) = (1 - d) + d * sum_{u in In(v)} score(u) / Out(u)\n  d = 0.85\n  iterate until convergence\n\nTextRank for summarization:\n  nodes = sentences\n  edge weight = similarity (e.g. cosine of tf-idf)\n  rank sentences, take the top-K\n\nProperties:\n  unsupervised, language-independent\n  no training data needed",
 invariant:"PageRank converges to the principal eigenvector of the transition matrix. The damping factor d ensures convergence.",
 uses:"Keyword extraction, summarization, keyphrase ranking.",
 strength:"Unsupervised, no training, language-independent.",
 limits:"Ignores syntax and semantics. Can favor frequent but uninformative words.",
 pitfall:"Stopwords dominate the graph unless removed. Always filter stopwords and optionally POS-tag.",
 question:"What does the damping factor d = 0.85 mean?",
 answer:"With probability 0.85 the random walker follows an edge; with probability 0.15 it jumps to a random node. This prevents sinks and ensures convergence.",
 demo:"textrank",sample:"Natural language processing is a field of computer science. Natural language processing and information retrieval are closely related. Information retrieval is the science of search.",refs:[
  ["Mihalcea and Tarau, TextRank: Bringing order into texts, EMNLP 2004","https://aclanthology.org/W04-3252/"],
  ["Brin and Page, The anatomy of a large-scale hypertextual web search engine, Computer Networks 1998","https://doi.org/10.1016/S0169-7552(98)00110-X"],
  ["Page et al., The PageRank citation ranking, Stanford 1999","http://ilpubs.stanford.edu:8090/422/"]]},
{id:"lda-nmf",title:"LDA and NMF topic models",level:5,kind:"Topic models",status:"Runnable teaching lab",
 summary:"LDA is a generative model where documents are mixtures of topics and topics are distributions over words. NMF factorizes the term-document matrix into topic and document matrices. Both discover latent topics.",
 mental:"Documents are mixtures of topics; topics are word distributions",
 mentalText:"LDA: each word is generated by sampling a topic for the document, then sampling a word from that topic. NMF: factorize X ~ W H with non-negative factors.",
 steps:["Build a term-document matrix (counts or tf-idf).","LDA: run collapsed Gibbs sampling or variational inference.","NMF: minimize ||X - WH||^2 with non-negativity.","Inspect the top words per topic."],
 pseudo:"LDA generative process:\n  for each topic k: draw phi_k ~ Dirichlet(beta)\n  for each document d:\n    draw theta_d ~ Dirichlet(alpha)\n    for each word w in d:\n      draw z ~ Categorical(theta_d)\n      draw w ~ Categorical(phi_z)\n\nCollapsed Gibbs sampler:\n  for each word w in document d:\n    decrement counts\n    p(z = k) proportional to (n_dk + alpha) * (n_kw + beta) / (n_k + beta V)\n    sample k, increment counts\n\nNMF:\n  minimize ||X - W H||_F^2\n  W >= 0, H >= 0\n  multiplicative updates or coordinate descent\n\nChoose K by coherence, perplexity or held-out likelihood.",
 invariant:"LDA assumes exchangeability: the order of words in a document is ignored. This is the bag-of-words assumption.",
 uses:"Topic discovery, document clustering, recommendation, content analysis.",
 strength:"Interpretable topics. LDA gives probabilistic assignments. NMF is faster and non-probabilistic.",
 limits:"Bag-of-words. Number of topics K must be chosen. Topics can be incoherent.",
 pitfall:"Running LDA with too many topics gives fragmented, uninterpretable topics. Start small and increase.",
 question:"What is the difference between LDA and NMF?",
 answer:"LDA is a probabilistic generative model with Dirichlet priors. NMF is a matrix factorization with non-negativity constraints. LDA gives probabilities; NMF gives weights.",
 demo:"lda",sample:"2 30\nthe cat sat on the mat\nthe dog sat on the log\nthe cat ate the rat\nthe dog chased the cat",refs:[
  ["Blei, Ng, Jordan, Latent Dirichlet Allocation, JMLR 2003","https://www.jmlr.org/papers/v3/blei03a.html"],
  ["Lee and Seung, Algorithms for non-negative matrix factorization, NIPS 2000","https://papers.nips.cc/paper/2000/hash/f9d1152547c0bde01830b7e8bd60024c-Abstract.html"],
  ["Griffiths and Steyvers, Finding scientific topics, PNAS 2004","https://doi.org/10.1073/pnas.0307752101"]]},
/* ================= 6 Parsing ================= */
{id:"fst-morphology",title:"Finite-state morphology",level:4,kind:"Morphology",status:"Concept lesson",
 summary:"Finite-state transducers map between surface forms and morphological analyses. They handle inflection, derivation and spelling rules with a compact, bidirectional representation.",
 mental:"A transducer that maps a word to its morphemes",
 mentalText:"A lexicon stores stems. FST rules handle affixes and phonological changes. Composition gives an efficient analyzer and generator.",
 steps:["Build a lexicon of stems and their features.","Write FST rules for affixes and morphophonology.","Compose the lexicons and rules into one transducer.","Apply it to analyze or generate words."],
 pseudo:"FST components:\n  lexicon: stem -> (stem, features)\n  rules: two-level constraints (e.g. y -> i before -es)\n  composition: lexicon . rules\n\nAnalysis:\n  surface form -> morphological features\n  e.g. 'cats' -> cat +N +Pl\n\nGeneration:\n  features -> surface form\n  cat +N +Pl -> cats\n\nTools:\n  HFST, Foma, OpenFST, Xerox xfst\n  used in Apertium, Giellatekno, Uniparser\n\nLanguages:\n  excellent for morphologically rich languages\n  Finnish, Turkish, Hungarian, Arabic, Inuktitut",
 invariant:"The transducer must be deterministic and minimal for efficiency. Composition must preserve the mapping.",
 uses:"Morphological analysis, spell checking, machine translation, information retrieval for morphologically rich languages.",
 strength:"Compact, bidirectional, handles complex morphology.",
 limits:"Writing rules for a new language takes expert time. Ambiguity requires disambiguation.",
 pitfall:"Rule ordering matters. Incorrect ordering produces wrong analyses or generation failures.",
 question:"What is the advantage of an FST over a stemmer?",
 answer:"An FST gives full morphological analysis (POS, features, morphemes) and is bidirectional. A stemmer only strips suffixes.",
 demo:"none",sample:"",refs:[
  ["Kaplan and Kay, Regular models of phonological rule systems, Computational Linguistics 1994","https://aclanthology.org/J94-3001/"],
  ["Beesley and Karttunen, Finite State Morphology, CSLI 2003","https://web.stanford.edu/group/cslipublications/cslipublications/site/1575864347.shtml"],
  ["Jurafsky and Martin, SLP 3rd ed., Ch. 3","https://web.stanford.edu/~jurafsky/slp3/"]]},
{id:"dependency-parsing",title:"Dependency parsing",level:5,kind:"Parsing",status:"Concept lesson",
 summary:"Dependency parsing links each word to its syntactic head with a labeled edge. The result is a tree. Transition-based and graph-based parsers are the two main families.",
 mental:"Every word points to its syntactic parent",
 mentalText:"The root is the main verb. Each word has one head. Labels are relations (nsubj, dobj, amod, ...). The tree captures grammatical structure.",
 steps:["Define the dependency scheme (Universal Dependencies).","Train a transition-based or graph-based parser.","Predict the head and label for each token.","Enforce a valid tree (single root, no cycles)."],
 pseudo:"Transition-based (arc-standard):\n  state: stack, buffer, arcs\n  transitions:\n    SHIFT: push buffer[0] to stack\n    LEFT-ARC(l): add arc stack[-1] <- stack[-2], pop stack[-2]\n    RIGHT-ARC(l): add arc stack[-2] -> stack[-1], pop stack[-1]\n  oracle: from a treebank\n  classifier: neural (BiLSTM, transformer) or greedy\n\nGraph-based (MST):\n  score every (head, dep, label) pair\n  find the maximum spanning tree\n  Chu-Liu-Edmonds algorithm\n\nEvaluation:\n  UAS: unlabelled attachment score\n  LAS: labelled attachment score\n\nUniversal Dependencies: 100+ languages, consistent labels.",
 invariant:"The output must be a tree: one root, each word one head, no cycles.",
 uses:"Information extraction, question answering, machine translation, grammar checking.",
 strength:"Directly useful for downstream tasks. UD gives cross-lingual consistency.",
 limits:"Errors propagate. Long-distance dependencies are hard. Ambiguity requires context.",
 pitfall:"Ignoring the tree constraint produces invalid structures. Always enforce a single root and acyclicity.",
 question:"What is the difference between UAS and LAS?",
 answer:"UAS (unlabelled attachment score) counts correct heads. LAS (labelled attachment score) counts correct heads and correct labels.",
 demo:"none",sample:"",refs:[
  ["Nivre, Dependency grammar and dependency parsing, 2005","https://cl.lingfil.uu.se/~nivre/docs/iwpt05.pdf"],
  ["Chen and Manning, A fast and accurate dependency parser, EMNLP 2014","https://aclanthology.org/D14-1082/"],
  ["Dozat and Manning, Deep biaffine attention for neural dependency parsing, ICLR 2017","https://arxiv.org/abs/1611.01734"]]},
{id:"constituency-parsing",title:"Constituency parsing and CYK",level:5,kind:"Parsing",status:"Runnable teaching lab",
 summary:"Constituency parsing builds a tree of nested phrases (NP, VP, PP, ...) using a context-free grammar. CYK is the classic dynamic-programming algorithm for parsing with a CFG in Chomsky Normal Form.",
 mental:"A tree of phrases, built bottom-up by combining spans",
 mentalText:"CYK fills a table: table[i][j] = set of nonterminals that derive the span from i to j. Combine spans via grammar rules A -> B C.",
 steps:["Convert the grammar to Chomsky Normal Form.","Initialize the table with lexical rules.","Fill spans of increasing length.","Read the start symbol at table[0][n-1]."],
 pseudo:"CYK (CFG in CNF):\n  for i in 1..n:\n    for A -> w_i in grammar:\n      table[i][i].add(A)\n  for length in 2..n:\n    for i in 1..n-length+1:\n      j = i + length - 1\n      for k in i..j-1:\n        for A -> B C in grammar:\n          if B in table[i][k] and C in table[k+1][j]:\n            table[i][j].add(A)\n  accept if S in table[1][n]\n\nComplexity: O(n^3 |G|)\n\nProbabilistic CFG:\n  each rule has a probability\n  inside algorithm computes P(w | G)\n  Viterbi variant finds the most likely tree\n\nCKY variant:\n  same as CYK but with probabilities\n  used in statistical parsing (Collins, Charniak)",
 invariant:"The grammar must be in Chomsky Normal Form: rules are A -> B C or A -> w.",
 uses:"Grammar checking, machine translation, question answering, information extraction.",
 strength:"Exact for CFGs. Well-understood. Probabilistic variants give the most likely tree.",
 limits:"Cubic time. CFG cannot capture all linguistic dependencies.",
 pitfall:"Ambiguity: many parse trees for the same sentence. A PCFG resolves this with probabilities.",
 question:"Why convert the grammar to CNF before CYK?",
 answer:"CYK requires binary rules. Long rules A -> B C D are binarized into A -> B X, X -> C D.",
 demo:"cyk",sample:"S -> NP VP\nNP -> Det N\nNP -> Det N PP\nVP -> V NP\nVP -> V NP PP\nPP -> P NP\nDet -> the\nDet -> a\nN -> cat\nN -> dog\nN -> mat\nV -> sat\nV -> ate\nP -> on\nthe cat sat on the mat",refs:[
  ["Cocke, Younger, Kasami (CYK algorithm, 1960s)","https://en.wikipedia.org/wiki/CYK_algorithm"],
  ["Jurafsky and Martin, SLP 3rd ed., Ch. 12-13","https://web.stanford.edu/~jurafsky/slp3/"],
  ["Manning and Schütze, Foundations of Statistical NLP, MIT Press 1999","https://mitpress.mit.edu/9780262133609/foundations-of-statistical-natural-language-processing/"]]},
/* ================= 7 Search indexes and ranking ================= */
{id:"inverted-index",title:"Inverted index and Boolean retrieval",level:3,kind:"IR",status:"Runnable teaching lab",
 summary:"An inverted index maps each term to the list of documents containing it (the postings list). Boolean retrieval intersects and unions postings to answer queries.",
 mental:"A dictionary from terms to document lists",
 mentalText:"For each term, store a sorted list of document IDs. To answer 'A AND B', intersect the two postings lists. 'A OR B' unions them.",
 steps:["Tokenize and normalize each document.","Build a term -> postings list dictionary.","Sort postings by document ID.","Answer queries with intersection / union / negation."],
 pseudo:"Inverted index:\n  index = {}  # term -> sorted list of doc IDs\n  for doc_id, doc in enumerate(documents):\n    for term in tokenize(doc):\n      index[term].append(doc_id)\n\nQuery processing:\n  AND: intersect sorted postings lists (two-pointer)\n  OR: union sorted postings lists\n  NOT: complement against the document set\n\nSkip pointers:\n  every sqrt(len) position, store a skip pointer\n  intersect in O(sqrt(L1) + sqrt(L2)) instead of O(L1 + L2)\n\nCompression:\n  gap encoding: store differences between doc IDs\n  variable-byte, gamma codes\n\nPositional index:\n  store positions within the document\n  allows phrase queries and proximity ranking",
 invariant:"Postings lists must be sorted by document ID for efficient intersection.",
 uses:"Search engines, Boolean retrieval, faceted search, log analysis.",
 strength:"Simple, fast, exact. Scales to billions of documents.",
 limits:"Exact term matching. No semantics, no ranking (Boolean only).",
 pitfall:"Stopword removal speeds up indexing but breaks phrase queries.",
 question:"How do you intersect two sorted postings lists?",
 answer:"Two pointers, one per list. Advance the pointer with the smaller doc ID. When they match, output the doc ID and advance both. O(L1 + L2).",
 demo:"inverted-index",sample:"the cat sat on the mat\nthe dog sat on the log\nthe cat ate the rat",refs:[
  ["Manning, Raghavan, Schütze, Introduction to Information Retrieval, Ch. 1-2","https://nlp.stanford.edu/IR-book/"],
  ["Zobel and Moffat, Inverted files for text search engines, ACM Computing Surveys 2006","https://doi.org/10.1145/1132956.1132959"],
  ["Büttcher, Clarke, Cormack, Information Retrieval: Implementing and Evaluating Search Engines, MIT Press 2010","https://mitpress.mit.edu/9780262516068/information-retrieval/"]]},
{id:"bm25",title:"BM25 and probabilistic ranking",level:4,kind:"IR",status:"Runnable teaching lab",
 summary:"BM25 is the standard ranking function for bag-of-words retrieval. It weights term frequency with saturation and document length normalization, and includes IDF.",
 mental:"A refined TF-IDF with saturation and length normalization",
 mentalText:"BM25 = IDF * (tf * (k1 + 1)) / (tf + k1 * (1 - b + b * dl / avgdl)). k1 controls saturation; b controls length normalization.",
 steps:["Compute IDF for each term.","For each query term, compute the BM25 term score per document.","Sum the term scores.","Rank documents by the total score."],
 pseudo:"BM25:\n  score(q, d) = sum_{t in q} IDF(t) * (tf(t, d) * (k1 + 1)) /\n                (tf(t, d) + k1 * (1 - b + b * dl(d) / avgdl))\n\n  IDF(t) = log((N - df(t) + 0.5) / (df(t) + 0.5) + 1)\n\nParameters:\n  k1 in [1.2, 2.0]: controls term frequency saturation\n  b in [0.5, 0.8]: controls document length normalization\n  k1 = 1.2, b = 0.75 are common defaults\n\nProperties:\n  tf saturation: more occurrences help less\n  length normalization: longer docs are penalized\n  IDF: rare terms get more weight\n\nVariants:\n  BM25+ (adds a floor to tf)\n  BM25F (fields, e.g. title vs body)\n  BM25 with query term weights",
 invariant:"The score is a sum over query terms. BM25 assumes terms are independent (the bag-of-words assumption).",
 uses:"Search engines, Elasticsearch, Lucene, recommendation, document ranking.",
 strength:"Strong baseline, no training, interpretable parameters, fast.",
 limits:"Bag-of-words. No semantics, no word order, no cross-term interactions.",
 pitfall:"BM25 is not a similarity metric; the absolute score is not meaningful. Only the ranking matters.",
 question:"What do k1 and b control in BM25?",
 answer:"k1 controls how quickly term frequency saturates. b controls how much longer documents are penalized.",
 demo:"bm25",sample:"the cat sat on the mat\nthe dog sat on the log\nthe cat ate the rat\nthe mat was on the floor\ncats and dogs are pets",refs:[
  ["Robertson and Zaragoza, The probabilistic relevance framework: BM25 and beyond, Foundations and Trends in IR 2009","https://doi.org/10.1561/1500000019"],
  ["Manning, Raghavan, Schütze, Introduction to Information Retrieval, Ch. 11","https://nlp.stanford.edu/IR-book/"],
  ["Trotman, Puurula, Burgess, Improvements to BM25 and language models examined, ADCS 2014","https://doi.org/10.1145/2682862.2682863"]]},
{id:"query-expansion",title:"Query expansion, rewriting and spelling correction",level:4,kind:"IR",status:"Concept lesson",
 summary:"Query expansion adds related terms to a query to improve recall. Spelling correction fixes typos. Pseudo-relevance feedback expands from the top documents.",
 mental:"Fix the query, then add synonyms or related terms",
 mentalText:"Spelling: use edit distance and noisy channel. Expansion: use WordNet, embeddings, or top retrieved documents (Rocchio, RM3).",
 steps:["Correct spelling with edit distance and a lexicon.","Expand with synonyms, acronyms, or stemming.","Optionally use pseudo-relevance feedback.","Re-rank the expanded query."],
 pseudo:"Spelling correction (noisy channel):\n  w_hat = argmax_w P(w) P(x | w)\n  P(w): language model (frequency)\n  P(x | w): edit distance or character n-gram similarity\n\nRocchio (relevance feedback):\n  q_new = alpha q + beta sum_{relevant} d - gamma sum_{nonrelevant} d\n\nRM3 (pseudo-relevance feedback):\n  retrieve top K documents\n  build a language model from them\n  interpolate with the original query\n\nEmbedding expansion:\n  add the top-K nearest neighbors of each query term\n\nQuery rewriting:\n  acronyms: 'nlp' -> 'natural language processing'\n  synonyms: 'car' -> 'automobile'\n  spelling: 'recieve' -> 'receive'",
 invariant:"Expansion must not change the user's intent. Over-expansion hurts precision.",
 uses:"Web search, e-commerce search, enterprise search, chatbots.",
 strength:"Improves recall, handles typos and vocabulary mismatch.",
 limits:"Over-expansion hurts precision. Domain-specific terms may not be in the expansion source.",
 pitfall:"Expanding with a general synonym set can add noise for domain-specific queries.",
 question:"What is pseudo-relevance feedback?",
 answer:"Assume the top-K retrieved documents are relevant, and use them to expand the query. It requires no user feedback but can drift if the top-K are wrong.",
 demo:"none",sample:"",refs:[
  ["Manning, Raghavan, Schütze, Introduction to Information Retrieval, Ch. 9","https://nlp.stanford.edu/IR-book/"],
  ["Rocchio, Relevance feedback in information retrieval, 1971","https://dl.acm.org/doi/10.5555/280765.280786"],
  ["Lavrenko and Croft, Relevance-based language models, SIGIR 2001","https://doi.org/10.1145/383952.383972"]]},
/* ================= 8 Semantic retrieval ================= */
{id:"dense-embeddings",title:"Dense embeddings and bi-encoders",level:5,kind:"Semantic retrieval",status:"Runnable teaching lab",
 summary:"Dense retrieval encodes queries and documents into vectors and ranks by cosine similarity. Bi-encoders encode query and document independently, enabling fast retrieval with approximate nearest neighbours.",
 mental:"A vector per query and per document; rank by cosine",
 mentalText:"Encode query with a query encoder, documents with a document encoder. At search time, encode the query and find the nearest document vectors.",
 steps:["Choose a bi-encoder (e.g. sentence-transformers, DPR, E5).","Encode all documents offline.","Build an index over the document vectors (FAISS, HNSW, ScaNN).","Encode the query and retrieve the top-K nearest neighbours."],
 pseudo:"Bi-encoder:\n  q_emb = E_q(query)\n  d_emb = E_d(document)\n  score = cos(q_emb, d_emb) or dot product\n\nContrastive training:\n  in-batch negatives: other documents in the batch are negatives\n  hard negatives: mine documents that are close but not relevant\n  loss: InfoNCE / cross-entropy over the batch\n\nIndex types:\n  exact: brute force (slow for large corpora)\n  IVF: k-means partitioning + inverted lists\n  HNSW: hierarchical navigable small-world graph\n  ScaNN: anisotropic vector quantization\n\nEvaluation:\n  recall@k, MRR, NDCG\n  top-K retrieved vs gold relevant",
 invariant:"The bi-encoder must be trained with contrastive loss. Similar queries and documents must have close embeddings.",
 uses:"Semantic search, RAG retrieval, recommendation, deduplication, clustering.",
 strength:"Fast retrieval at scale. Handles synonyms and paraphrase.",
 limits:"Less precise than cross-encoders. Requires a trained encoder and an index.",
 pitfall:"Using a general-purpose sentence encoder without fine-tuning on the target domain gives poor retrieval.",
 question:"What is the difference between a bi-encoder and a cross-encoder?",
 answer:"A bi-encoder encodes query and document separately, so documents can be pre-encoded and retrieved with ANN. A cross-encoder takes query and document together, scores them jointly, and is much slower but more accurate.",
 demo:"dense-embeddings",sample:"the cat sat on the mat\nthe dog sat on the log\nthe cat ate the rat\ncats and dogs are pets\nkittens and puppies are cute",refs:[
  ["Karpukhin et al., Dense passage retrieval for open-domain question answering, EMNLP 2020","https://arxiv.org/abs/2004.04906"],
  ["Reimers and Gurevych, Sentence-BERT, EMNLP 2019","https://arxiv.org/abs/1908.10084"],
  ["Johnson, Douze, Jégou, Billion-scale similarity search with GPUs (FAISS), IEEE TBD 2019","https://arxiv.org/abs/1702.08734"]]},
{id:"vector-indexes",title:"Vector indexes and approximate nearest neighbours",level:5,kind:"Vector search",status:"Concept lesson",
 summary:"Exact nearest neighbour search is O(N) per query. Approximate indexes trade a little recall for a large speedup. HNSW, IVF and product quantization are the main families.",
 mental:"A data structure that finds close vectors fast",
 mentalText:"HNSW builds a multi-layer graph and walks from the top. IVF partitions with k-means. PQ compresses vectors into short codes and re-ranks.",
 steps:["Choose the index type based on scale and latency.","Build the index over the document vectors.","Tune the parameters (ef, nprobe, M).","Measure recall@k vs speed."],
 pseudo:"HNSW:\n  build a multi-layer graph\n  each node connects to M neighbours at each layer\n  search: start at the top layer, greedily walk to the closest\n  then descend to layer 0 and do a best-first search with ef candidates\n\nIVF:\n  k-means into nlist clusters\n  at query time, search the nprobe closest clusters\n  nprobe controls the recall-speed trade-off\n\nProduct quantization (PQ):\n  split each vector into m subvectors\n  k-means each subvector into 256 centroids\n  encode each subvector as one byte\n  4x-64x compression\n  re-rank the top candidates with full vectors\n\nParameter trade-offs:\n  HNSW: M (graph degree), efConstruction, efSearch\n  IVF: nlist, nprobe\n  PQ: m, nbits",
 invariant:"ANN indexes trade recall for speed. Always measure recall against exact search on a sample.",
 uses:"Semantic search, RAG, recommendation, image search, deduplication.",
 strength:"Sub-linear query time at scale. Billions of vectors with PQ.",
 limits:"Approximate. Build time and memory can be large. Parameter tuning is empirical.",
 pitfall:"Building the index on unnormalized vectors breaks cosine similarity. Normalize before indexing.",
 question:"What does nprobe control in an IVF index?",
 answer:"The number of clusters searched at query time. Higher nprobe means higher recall but slower queries.",
 demo:"none",sample:"",refs:[
  ["Malkov and Yashunin, Efficient and robust approximate nearest neighbor search using HNSW, IEEE TPAMI 2020","https://arxiv.org/abs/1603.09320"],
  ["Jégou, Douze, Schmid, Product quantization for nearest neighbor search, IEEE TPAMI 2011","https://doi.org/10.1109/TPAMI.2010.57"],
  ["Johnson, Douze, Jégou, Billion-scale similarity search with GPUs, IEEE TBD 2019","https://arxiv.org/abs/1702.08734"]]},
{id:"hybrid-retrieval",title:"Hybrid retrieval: sparse + dense",level:5,kind:"Retrieval",status:"Concept lesson",
 summary:"Hybrid retrieval combines sparse (BM25) and dense (embedding) scores. It handles both exact term matches and semantic similarity. Fusion via linear combination or reciprocal rank fusion (RRF).",
 mental:"Run both retrievers, then merge the rankings",
 mentalText:"BM25 catches exact matches and rare terms. Dense catches paraphrase and synonyms. Combine the scores or ranks.",
 steps:["Run BM25 and dense retrieval in parallel.","Fuse the two rankings.","Optionally re-rank with a cross-encoder.","Return the top-K results."],
 pseudo:"Linear fusion:\n  score = alpha * dense_score + (1 - alpha) * sparse_score\n\nReciprocal rank fusion (RRF):\n  score(d) = sum_{r in retrievers} 1 / (k + rank_r(d))\n  k = 60 is common\n  robust to score scale differences\n\nMulti-stage pipeline:\n  1. BM25 top-1000\n  2. Dense top-1000\n  3. Fuse (RRF) -> top-100\n  4. Cross-encoder rerank -> top-10\n  5. Return with citations\n\nBenefits:\n  sparse handles rare terms, numbers, names\n  dense handles paraphrase and synonyms\n  fusion is more robust than either alone",
 invariant:"Fusion must be scale-aware. RRF avoids the scale problem by using ranks.",
 uses:"Production search, RAG retrieval, e-commerce, enterprise search.",
 strength:"Robust. Handles both exact and semantic matches.",
 limits:"More compute and more moving parts. Fusion weights need tuning.",
 pitfall:"Averaging raw scores from BM25 and dense is risky because the scales differ. Use RRF or normalize.",
 question:"Why is RRF robust?",
 answer:"It uses ranks instead of raw scores, so it does not need the retrievers' scores to be on the same scale.",
 demo:"none",sample:"",refs:[
  ["Cormack, Clarke, Buettcher, Reciprocal rank fusion outperforms Condorcet and individual rank learning methods, SIGIR 2009","https://doi.org/10.1145/1571941.1572114"],
  ["Karpukhin et al., Dense passage retrieval, EMNLP 2020","https://arxiv.org/abs/2004.04906"],
  ["Bruch, Gai, Ingber, An analysis of fusion functions for hybrid retrieval, ACM TOIS 2024","https://doi.org/10.1145/3596512"]]},
/* ================= 9 Reranking and QA ================= */
{id:"cross-encoder",title:"Cross-encoders and reranking",level:5,kind:"Reranking",status:"Runnable teaching lab",
 summary:"A cross-encoder takes the query and a candidate passage together and produces a relevance score. It is much more accurate than a bi-encoder but too slow for first-stage retrieval, so it is used for reranking the top-K.",
 mental:"Score each candidate against the query jointly",
 mentalText:"Concatenate query and passage, feed to a transformer, take the [CLS] or pooled output. Use a cross-entropy loss during training.",
 steps:["Retrieve top-K candidates with a fast retriever.","For each candidate, run the cross-encoder.","Sort by the cross-encoder score.","Return the top-N."],
 pseudo:"Cross-encoder:\n  input: [CLS] query [SEP] passage [SEP]\n  output: relevance score\n\nTraining:\n  positive pairs: (query, relevant passage)\n  negative pairs: (query, random or hard negative)\n  loss: cross-entropy over a batch\n\nReranking pipeline:\n  1. Bi-encoder or BM25 retrieves top-K (K = 50-1000)\n  2. Cross-encoder scores each candidate\n  3. Sort by score, return top-N\n\nTrade-offs:\n  cross-encoder: O(K) transformer forward passes per query\n  bi-encoder: O(1) query encoding + ANN lookup\n  use cross-encoder for K up to a few hundred\n\nModels:\n  monoBERT, monoELECTRA, MiniLM cross-encoder\n  BGE-reranker, Cohere Rerank",
 invariant:"The cross-encoder must be trained on the same task distribution. Domain shift hurts accuracy.",
 uses:"Search reranking, RAG, QA, recommendation, evidence ranking.",
 strength:"Very accurate. Can model fine-grained interactions.",
 limits:"Slow: O(K) forward passes. Not usable for first-stage retrieval.",
 pitfall:"Reranking too many candidates is slow. Choose K based on latency budget.",

 "bpe":{python:`from collections import Counter

def get_pairs(word):
    return [(word[i], word[i+1]) for i in range(len(word)-1)]

def train_bpe(corpus, num_merges):
    # Each word: tuple of characters + end-of-word marker
    vocab = Counter()
    for word in corpus.split():
        vocab[tuple(word) + ('</w>',)] += 1
    merges = []
    for _ in range(num_merges):
        pairs = Counter()
        for word, freq in vocab.items():
            for pair in get_pairs(word):
                pairs[pair] += freq
        if not pairs:
            break
        best = pairs.most_common(1)[0][0]
        merges.append(best)
        new_vocab = Counter()
        for word, freq in vocab.items():
            i = 0
            new_word = []
            while i < len(word):
                if i < len(word)-1 and (word[i], word[i+1]) == best:
                    new_word.append(word[i] + word[i+1])
                    i += 2
                else:
                    new_word.append(word[i])
                    i += 1
            new_vocab[tuple(new_word)] += freq
        vocab = new_vocab
    return merges, vocab

    while i < len(word):

            piece = word[i:j]
            if i > 0:
                piece = "##" + piece
            if piece in vocab or word[i:j] in vocab:

                i = j

from collections import Counter, defaultdict

def train_bigram(corpus, k=1):
    tokens = corpus.lower().split()
    counts = Counter(tokens)
    bigrams = Counter(zip(tokens[:-1], tokens[1:]))
    V = len(counts)
    return counts, bigrams, V

def bigram_logprob(w1, w2, counts, bigrams, V, k=1):
    return math.log((bigrams[(w1, w2)] + k) / (counts[w1] + k * V))

    tokens = corpus.lower().split()
    N = len(tokens) - 1
    logp = sum(bigram_logprob(tokens[i], tokens[i+1], counts, bigrams, V, k) for i in range(N))

def viterbi(obs, states, start_p, trans_p, emit_p):
    V = [{}]
    path = {}
    for s in states:
        V[0][s] = math.log(start_p[s]) + math.log(emit_p[s].get(obs[0], 1e-9))
        path[s] = [s]
    for t in range(1, len(obs)):
        V.append({})
        new_path = {}
        for s in states:

                (V[t-1][s2] + math.log(trans_p[s2][s]) + math.log(emit_p[s].get(obs[t], 1e-9)), s2)
                for s2 in states

            V[t][s] = best_prob
            new_path[s] = path[best_state] + [s]

from collections import Counter

def tfidf(docs):
    tokenized = [doc.lower().split() for doc in docs]
    N = len(docs)
    df = Counter()
    for tokens in tokenized:
        for w in set(tokens):
            df[w] += 1
    vectors = []
    for tokens in tokenized:
        tf = Counter(tokens)
        vec = {}
        for w, c in tf.items():
            vec[w] = (1 + math.log(c)) * math.log((N + 1) / (df[w] + 1)) + 1

        vectors.append({w: v/norm for w, v in vec.items()})

 "textrank":{python:`from collections import Counter, defaultdict

def textrank(text, window=2, d=0.85, iters=30):
    tokens = [w for w in text.lower().split() if w.isalpha()]
    # Build graph
    graph = defaultdict(set)
    for i, w in enumerate(tokens):
        for j in range(max(0, i-window), min(len(tokens), i+window+1)):
            if i != j:
                graph[w].add(tokens[j])
                graph[tokens[j]].add(w)
    # PageRank
    nodes = list(graph.keys())
    scores = {n: 1.0/len(nodes) for n in nodes}
    for _ in range(iters):
        new = {}
        for n in nodes:
            s = (1 - d)
            for m in graph[n]:
                s += d * scores[m] / len(graph[m])
            new[n] = s
        scores = new
    return sorted(scores.items(), key=lambda x: -x[1])

 "lda":{python:`import random
from collections import Counter

def lda(docs, K=2, iters=50, alpha=0.1, beta=0.01):
    tokenized = [doc.lower().split() for doc in docs]
    vocab = sorted(set(w for d in tokenized for w in d))
    w2i = {w: i for i, w in enumerate(vocab)}
    V = len(vocab)
    # Initialize topics randomly
    z = [[random.randrange(K) for _ in d] for d in tokenized]
    # Counts
    ndk = [[0]*K for _ in tokenized]
    nkw = [[0]*V for _ in range(K)]
    nk = [0]*K
    for d, doc in enumerate(tokenized):
        for w, word in enumerate(doc):
            k = z[d][w]
            wi = w2i[word]
            ndk[d][k] += 1
            nkw[k][wi] += 1
            nk[k] += 1
    for _ in range(iters):
        for d, doc in enumerate(tokenized):
            for w, word in enumerate(doc):
                wi = w2i[word]
                old = z[d][w]
                ndk[d][old] -= 1
                nkw[old][wi] -= 1
                nk[old] -= 1
                probs = []
                for k in range(K):
                    p = (ndk[d][k] + alpha) * (nkw[k][wi] + beta) / (nk[k] + beta * V)
                    probs.append(p)
                total = sum(probs)
                probs = [p/total for p in probs]
                r = random.random()
                cum = 0
                new = K-1
                for k, p in enumerate(probs):
                    cum += p
                    if r < cum:
                        new = k
                        break
                z[d][w] = new
                ndk[d][new] += 1
                nkw[new][wi] += 1
                nk[new] += 1
    # Top words per topic
    topics = []
    for k in range(K):
        top = sorted(range(V), key=lambda i: -nkw[k][i])[:8]
        topics.append([vocab[i] for i in top])
    return topics

docs = [
    "the cat sat on the mat",
    "the dog sat on the log",
    "the cat ate the rat",
    "the dog chased the cat",

from collections import Counter

def bm25(query, docs, k1=1.2, b=0.75):
    tokenized = [doc.lower().split() for doc in docs]
    N = len(docs)
    avgdl = sum(len(d) for d in tokenized) / N
    df = Counter()
    for d in tokenized:
        for w in set(d):
            df[w] += 1
    scores = []
    for i, d in enumerate(tokenized):
        tf = Counter(d)
        dl = len(d)
        s = 0.0
        for term in query.lower().split():
            if term not in tf:
                continue
            idf = math.log((N - df[term] + 0.5) / (df[term] + 0.5) + 1)
            num = tf[term] * (k1 + 1)
            den = tf[term] + k1 * (1 - b + b * dl / avgdl)
            s += idf * num / den
        scores.append((i, s))
    return sorted(scores, key=lambda x: -x[1])

def embed(text, dim=32):

def cross_score(query, passage):

    # term overlap + length normalization + query term coverage
    q = set(query.lower().split())

def score_span(question, passage, start, end, tokens):

def recursive_chunks(text, size=80):
    separators = ["\\n\\n", "\\n", ". ", " ", ""]
    def split(t, seps):
        if len(t) <= size:
            return [t]
        for sep in seps:
            if sep == "":
                return [t[i:i+size] for i in range(0, len(t), size)]
            if sep in t:
                parts = t.split(sep)
                out = []
                for p in parts:
                    out.extend(split(p + sep, seps[seps.index(sep)+1:]))
                return out
        return [t]

/* Text utilities */
function tokenize(text,lower=true,stripPunct=false){
 let t=text;
 if(lower)t=t.toLowerCase();
 if(stripPunct)t=t.replace(/[^\w\s]/g,' ');
 return t.split(/\s+/).filter(Boolean);
}
function sentences(text){

function cosineSparse(a,b){
 let dot=0;
 for(const k in a)if(b[k])dot+=a[k]*b[k];
 let na=0,nb=0;
 for(const k in a)na+=a[k]*a[k];
 for(const k in b)nb+=b[k]*b[k];
 return dot/(Math.sqrt(na)*Math.sqrt(nb)+1e-12);
}
function cosineDense(a,b){
 let dot=0;
 for(let i=0;i<a.length;i++)dot+=a[i]*b[i];
 return dot;
}

function normalizeDense(a){const n=norm2(a)||1;return a.map(v=>v/n)}

/* Simplified Porter-like stemmer */
function stem(w){
 w=w.toLowerCase();
 if(w.length<=3)return w;
 const suffixes=["ingly","edly","ing","ed","ly","es","s"];
 for(const suf of suffixes){
  if(w.endsWith(suf)&&w.length-suf.length>=3){w=w.slice(0,-suf.length);break}
 }
 if(w.endsWith("i")&&w.length>3)w=w.slice(0,-1)+"y";
 return w;
}

/* 2 BPE */
function demoBpe(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 let merges=20,corpus='';
 if(lines.length>=2&&/^\d+$/.test(lines[0].trim())){merges=parseInt(lines[0]);corpus=lines.slice(1).join(' ')}
 else corpus=lines.join(' ');
 if(!corpus.trim())throw Error('Enter a corpus on the second line.');
 // Initial: each word as characters + end marker
 const vocab=new Map();
 for(const w of corpus.split(/\s+/)){
  if(!w)continue;
  const key=w.split('').concat('</w>');
  const k=key.join(' ');
  vocab.set(k,(vocab.get(k)||0)+1);
 }
 const mergeLog=[];
 const mergeTable=new Map();
 for(let m=0;m<merges;m++){
  // Count pairs
  const pairs=new Map();
  for(const [k,freq] of vocab){
   const w=k.split(' ');
   for(let i=0;i<w.length-1;i++){
    const p=w[i]+' '+w[i+1];
    pairs.set(p,(pairs.get(p)||0)+freq);
   }
  }
  if(!pairs.size)break;
  let best=null,bestC=0;
  for(const [p,c] of pairs)if(c>bestC){bestC=c;best=p}
  if(!best)break;
  mergeTable.set(best,m);
  mergeLog.push(`Merge ${m+1}: "${best}" (count ${bestC})`);
  // Apply merge
  const newVocab=new Map();
  for(const [k,freq] of vocab){
   const w=k.split(' ');
   const out=[];
   let i=0;
   while(i<w.length){
    if(i<w.length-1&&w[i]+' '+w[i+1]===best){
     out.push(w[i]+w[i+1]);
     i+=2;
    } else {out.push(w[i]);i++}
   }
   newVocab.set(out.join(' '),(newVocab.get(out.join(' '))||0)+freq);
  }
  vocab.clear();
  for(const [k,f] of newVocab)vocab.set(k,f);
 }
 const vocabList=[...vocab.keys()];
 return {
  encoded:`Corpus: ${corpus}\nMerges requested: ${merges}\n\nMerge log:\n${mergeLog.join('\n')||'(no merges)'}\n\nFinal vocabulary (${vocabList.length} entries):\n${vocabList.slice(0,30).map(v=>'  '+v.replace(/ /g,'')).join('\n')}`,
  decoded:`BPE starts with characters and merges the most frequent adjacent pair. After k merges, the vocabulary contains characters plus k merged subwords.`
 };
}

function demoWordpiece(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 let vocabWords=[],target='';
 if(lines.length>=2){
  vocabWords=lines[0].split(/\s+/).filter(Boolean);
  target=lines[1].trim();
 } else {
  vocabWords=lines[0].split(/\s+/).filter(Boolean);
  target=vocabWords[0]||'';
 }
 if(!vocabWords.length)throw Error('Enter vocabulary words on the first line.');
 // Build vocab of prefixes
 const vocab=new Set();
 for(const w of vocabWords){
  for(let i=1;i<=w.length;i++)vocab.add(w.slice(0,i));
 }
 // Greedy longest match on target
 const tokens=[];
 let i=0;
 while(i<target.length){
  let found=false;
  for(let j=target.length;j>i;j--){
   const piece=target.slice(i,j);
   const wp=i>0?'##'+piece:piece;
   if(vocab.has(piece)||vocab.has(wp)){
    tokens.push(wp);
    i=j;
    found=true;
    break;
   }
  }
  if(!found){
   tokens.push('[UNK]');
   i++;
  }
 }
 return {
  encoded:`Vocabulary words: ${vocabWords.join(', ')}\nTarget: ${target}\n\nTokenization:\n  ${tokens.join(' | ')}\n\nVocabulary size (prefix set): ${vocab.size}`,
  decoded:`WordPiece tokenizes with greedy longest match. Subwords after the first are prefixed with ##. Unknown characters become [UNK].`
 };
}

function demoNgram(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 let n=2,corpus='';
 if(lines.length>=2&&/^\d+$/.test(lines[0].trim())){n=Math.max(1,Math.min(parseInt(lines[0]),4));corpus=lines.slice(1).join(' ')}
 else corpus=lines.join(' ');
 const tokens=tokenize(corpus,true,true);
 if(tokens.length<n+1)throw Error('Corpus too short for this n.');
 const counts={},ngrams={};
 for(let i=0;i<tokens.length;i++){
  counts[tokens[i]]=(counts[tokens[i]]||0)+1;
  if(i>=n-1){
   const key=tokens.slice(i-n+1,i+1).join(' ');
   const hist=tokens.slice(i-n+1,i).join(' ');
   ngrams[key]=(ngrams[key]||0)+1;
   ngrams['H:'+hist]=(ngrams['H:'+hist]||0)+1;
  }

  const hist=tokens.slice(i-n+1,i).join(' ');
  const key=tokens.slice(i-n+1,i+1).join(' ');
  const num=(ngrams[key]||0)+k;
  const den=(ngrams['H:'+hist]||0)+k*V;
  logprobs.push(Math.log(num/den));
 }

  decoded:`The n-gram model predicts the next token from the previous n-1 tokens. Perplexity is the exponentiated average negative log-probability. Lower is better.`
 };

function demoNaiveBayes(text){

 if(lines.length<2)throw Error('Enter lines of the form "label: text".');

  labels.push(line.slice(0,idx).trim());
  docs.push(line.slice(idx+1).trim());

  const c=labels[i];

  if(!wordCounts[c])wordCounts[c]={};
  for(const w of tokenize(docs[i],true,true)){
   wordCounts[c][w]=(wordCounts[c][w]||0)+1;

   for(const w of tokenize(doc,true,true)){

  encoded:`Classes: ${classes.join(', ')}\nVocabulary: ${V}\nAlpha: ${alpha}\n\nPredictions:\n${out.map(o=>'  '+o).join('\n')}\n\nWord counts:\n${classes.map(c=>`  ${c}: ${Object.entries(wordCounts[c]).map(([w,n])=>`${w}:${n}`).join(', ')}`).join('\n')}`,

function demoViterbi(text){

 if(lines.length<3)throw Error('Enter: start probs, trans probs (2 lines), emission probs (2 lines), then observations.');
 // Parse start probs

 // Emissions: 2x2
 const emit=lines[2].split(/[\s,]+/).filter(Boolean).map(Number);
 // Observations: last line
 const obs=lines[3].split(/[\s,]+/).filter(Boolean).map(Number);
 const states=[0,1];
 const log2=x=>Math.log(Math.max(x,1e-12));
 const V=[{}];

 for(const s of states){
  V[0][s]=log2(start[s])+log2(emit[s*2+obs[0]]);
  path[s]=[s];
